<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overscroll-behavior: none;
    font-family: -apple-system, system-ui, sans-serif; }
  #container { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .pane { position: relative; width: 100%; }
  #main { flex: 1 1 auto; min-height: 0; }
  .sub { flex: 0 0 108px; border-top: 1px solid #1c2230; }
  .lbl { position: absolute; top: 3px; left: 6px; font-size: 10px; color: #9aa4b2; z-index: 3; pointer-events: none; }
</style>
<!-- Lightweight Charts bundled locally (Copy Bundle Resources flattens it next to this html). -->
<script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="container">
  <div id="main" class="pane"></div>
  <div id="rsi" class="pane sub"><span class="lbl">RSI</span></div>
  <div id="macd" class="pane sub"><span class="lbl">MACD</span></div>
</div>
<script>
// Multi-pane port of web/src/components/{ChartPanel,SubPanels}.tsx: main candles + EMA/volume/
// price-lines, with RSI + MACD sub-panels below, all time-synced. window.setChart(payload) is
// called by the Swift side (WebChartView). Charts are recreated on each payload (the Swift
// Coordinator dedups, so this only runs on real data/timeframe/theme changes — not during panning,
// which Lightweight Charts handles internally).
var pending = null, charts = [];

function opts(dark, showTime) {
  return {
    layout: { background: { type: 'solid', color: dark ? '#0b0e14' : '#ffffff' }, textColor: dark ? '#9aa4b2' : '#4a5568' },
    grid: { vertLines: { color: dark ? '#141a25' : '#eef0f3' }, horzLines: { color: dark ? '#141a25' : '#eef0f3' } },
    rightPriceScale: { borderColor: dark ? '#1c2230' : '#e2e5ea' },
    timeScale: { borderColor: dark ? '#1c2230' : '#e2e5ea', timeVisible: true, secondsVisible: false, visible: !!showTime },
    crosshair: { mode: 0 },
    autoSize: true,
  };
}
function clean(pts) { return (pts || []).filter(function (p) { return p && isFinite(p.value); }); }

function render(p) {
  charts.forEach(function (c) { try { c.remove(); } catch (e) {} });
  charts = [];
  var dark = !!p.dark;

  // ── Main pane: candles + EMAs + price lines + volume (time axis hidden; shared axis at bottom) ──
  var main = LightweightCharts.createChart(document.getElementById('main'), opts(dark, false));
  charts.push(main);
  var candle = main.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350' });
  var data = (p.candles || []).map(function (c) { return { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close }; })
                              .sort(function (a, b) { return a.time - b.time; });
  candle.setData(data);
  if (!data.length) return;
  candle.applyOptions({ priceFormat: { type: 'price', precision: p.precision || 2, minMove: Math.pow(10, -(p.precision || 2)) } });

  (p.lines || []).forEach(function (ln) {
    if (!ln.points || !ln.points.length) return;
    var ls = main.addLineSeries({ color: ln.color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    ls.setData(ln.points);
  });
  (p.priceLines || []).forEach(function (l) {
    candle.createPriceLine({ price: l.price, color: l.color, lineWidth: 1, lineStyle: l.dashed ? 2 : 0, axisLabelVisible: true, title: l.title });
  });
  if (p.volume && p.volume.length) {
    var vol = main.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
    vol.setData(p.volume);
    main.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  }

  // ── RSI pane (line + 70/30 guides) ──
  var rsiC = LightweightCharts.createChart(document.getElementById('rsi'), opts(dark, false));
  charts.push(rsiC);
  var rsiL = rsiC.addLineSeries({ color: '#e6c84f', lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
  rsiL.setData(clean(p.rsi));
  [70, 30].forEach(function (g) { rsiL.createPriceLine({ price: g, color: '#2c3b4a', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: String(g) }); });

  // ── MACD pane (histogram + macd + signal). Bottom pane keeps the shared time axis. ──
  var macdC = LightweightCharts.createChart(document.getElementById('macd'), opts(dark, true));
  charts.push(macdC);
  var pf = { type: 'price', precision: p.macdPrecision || 3, minMove: Math.pow(10, -(p.macdPrecision || 3)) };
  var h = macdC.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false, priceFormat: pf });
  h.setData(p.macdHist || []);
  var ml = macdC.addLineSeries({ color: '#5b8def', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false, priceFormat: pf });
  ml.setData(clean(p.macdLine));
  var sg = macdC.addLineSeries({ color: '#f0a020', lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false, priceFormat: pf });
  sg.setData(clean(p.macdSignal));

  // ── Sync visible TIME range across all panes (time-based → robust to warmup-offset lengths) ──
  var syncing = false;
  charts.forEach(function (src) {
    src.timeScale().subscribeVisibleTimeRangeChange(function (r) {
      if (syncing || !r) return;
      syncing = true;
      charts.forEach(function (dst) { if (dst !== src) { try { dst.timeScale().setVisibleRange(r); } catch (e) {} } });
      syncing = false;
    });
  });
  main.timeScale().fitContent();
}

window.setChart = function (payload) {
  try {
    var p = (typeof payload === 'string') ? JSON.parse(payload) : payload;
    if (window.LightweightCharts && document.getElementById('main')) render(p);
    else pending = p;
  } catch (e) { /* best-effort */ }
};
window.addEventListener('load', function () { if (pending) { render(pending); pending = null; } });
</script>
</body>
</html>
