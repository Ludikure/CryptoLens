<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overscroll-behavior: none; }
  #chart { position: absolute; inset: 0; }
</style>
<!-- Lightweight Charts is bundled locally (Copy Bundle Resources flattens it to the .app root,
     the same directory as this html) — no CDN, works offline. -->
<script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="chart"></div>
<script>
// Port of web/src/components/ChartPanel.tsx. Exposes window.setChart(payload) for the Swift side
// (WebChartView) to push candles + EMA/VWAP lines + S/R/setup price lines. The hard pan/zoom/
// crosshair work is Lightweight Charts' — the whole reason we moved off the SwiftUI Canvas.
var chart = null, candle = null, volSeries = null;
var overlays = [];      // ISeriesApi<'Line'> for EMAs
var priceLines = [];    // IPriceLine for S/R + setup levels
var pending = null;     // last payload received before the chart was ready

function makeChart(dark) {
  var bg = dark ? '#0b0e14' : '#ffffff';
  var text = dark ? '#9aa4b2' : '#4a5568';
  var grid = dark ? '#1c2230' : '#eaecef';
  chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { type: 'solid', color: bg }, textColor: text },
    grid: { vertLines: { color: grid }, horzLines: { color: grid } },
    rightPriceScale: { borderColor: grid, autoScale: true },
    timeScale: { borderColor: grid, timeVisible: true, secondsVisible: false },
    crosshair: { mode: 0 },   // magnet off — free crosshair
    autoSize: true,
    handleScale: { axisPressedMouseMove: true },
  });
  candle = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });
}

function render(p) {
  if (!chart) makeChart(!!p.dark);
  else chart.applyOptions({
    layout: { background: { type: 'solid', color: p.dark ? '#0b0e14' : '#ffffff' }, textColor: p.dark ? '#9aa4b2' : '#4a5568' },
  });

  // Tear down the previous symbol's overlays + price lines FIRST (imperative). Leaving old S/R
  // price lines on the series pins the auto-scale to the prior symbol's range (BTC $60k vs ETH $2k).
  priceLines.forEach(function (pl) { try { candle.removePriceLine(pl); } catch (e) {} });
  overlays.forEach(function (o) { try { chart.removeSeries(o); } catch (e) {} });
  priceLines = []; overlays = [];

  var data = (p.candles || []).map(function (c) {
    return { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close };
  }).sort(function (a, b) { return a.time - b.time; });
  candle.setData(data);
  if (!data.length) return;

  var minMove = Math.pow(10, -(p.precision || 2));
  candle.applyOptions({ priceFormat: { type: 'price', precision: p.precision || 2, minMove: minMove } });

  (p.lines || []).forEach(function (ln) {
    if (!ln.points || !ln.points.length) return;
    var ls = chart.addLineSeries({ color: ln.color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    ls.setData(ln.points);
    overlays.push(ls);
  });

  (p.priceLines || []).forEach(function (l) {
    priceLines.push(candle.createPriceLine({
      price: l.price, color: l.color, lineWidth: 1,
      lineStyle: l.dashed ? 2 : 0, axisLabelVisible: true, title: l.title,
    }));
  });

  // Volume histogram pinned to the bottom ~18% (its own overlay price scale so it doesn't
  // compress the candles).
  if (volSeries) { try { chart.removeSeries(volSeries); } catch (e) {} volSeries = null; }
  if (p.volume && p.volume.length) {
    volSeries = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
    volSeries.setData(p.volume);
    chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  }

  chart.timeScale().fitContent();
  chart.priceScale('right').applyOptions({ autoScale: true });
}

window.setChart = function (payload) {
  try {
    var p = (typeof payload === 'string') ? JSON.parse(payload) : payload;
    if (document.readyState === 'complete' && window.LightweightCharts) render(p);
    else pending = p;
  } catch (e) { /* swallow — Swift side is best-effort */ }
};

window.addEventListener('load', function () {
  if (pending) { render(pending); pending = null; }
});
</script>
</body>
</html>
