<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overscroll-behavior: none;
    font-family: -apple-system, system-ui, sans-serif; }
  /* touch-action:none — the page never scrolls/zooms natively; without this WebKit holds touches
     in gesture arbitration before handing them to the chart's DOM handlers (laggy drag starts). */
  #container { position: absolute; inset: 0; display: flex; flex-direction: column; touch-action: none; }
  .pane { position: relative; width: 100%; touch-action: none; }
  /* Fit-to-screen (TradingView-mobile style): the main chart + enabled sub-panels DIVIDE the
     container height proportionally (main 3 : each sub 1) rather than each sub taking a fixed
     height. So 0 panels → main fills; 2 panels → main ~60% / subs ~20% each; 4 panels → main ~43%
     / subs ~14% each. Always fits one screen → the page never needs to scroll → no gesture fight. */
  #main { flex: 3 1 0; min-height: 0; }
  .sub { flex: 1 1 0; min-height: 0; border-top: 1px solid #1c2230; }
  .lbl { position: absolute; top: 3px; left: 6px; font-size: 10px; color: #9aa4b2; z-index: 3; pointer-events: none; }
  /* EMA legend, top-left of the price pane (TradingView-style): colored name per overlay line. */
  #legend { position: absolute; top: 3px; left: 44px; z-index: 3; pointer-events: none;
    font-size: 10px; font-weight: 600; display: flex; gap: 10px; }
  #legend span::before { content: '—'; margin-right: 3px; font-weight: 700; }
  /* OHLC readout (TradingView-style): crosshair bar's values, or the last bar when idle. */
  #ohlc { position: absolute; top: 16px; left: 44px; z-index: 3; pointer-events: none;
    font-size: 10px; font-weight: 500; color: #9aa4b2; font-variant-numeric: tabular-nums; }
  #ohlc b { font-weight: 600; }
  .lbl { font-variant-numeric: tabular-nums; }
  /* Drag handle between panes (TradingView-style): drag to grow one pane / shrink its neighbor.
     10px transparent strip with a visible grip; touch-action:none so the drag doesn't scroll/pan. */
  .divider { flex: 0 0 11px; background: transparent; cursor: row-resize; touch-action: none;
    position: relative; z-index: 5; }
  .divider::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 34px; height: 3px; border-radius: 2px; background: #6b7787; }
</style>
<script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="container">
  <div id="main" class="pane"></div>
</div>
<script>
// Multi-pane port of web/src/components/{ChartPanel,SubPanels}.tsx. window.setChart(payload) is
// called by the Swift side (WebChartView).
//
// FLASH FIX (2026-07-03): the charts are built ONCE and data is updated IN PLACE (setData) on
// subsequent payloads. They are torn down + rebuilt only when the STRUCTURE changes (theme or the
// enabled sub-panel set). Previously every payload did chart.remove()+recreate, so the several
// staged payloads on first launch (cached → indicators → ML → analysis) flashed the chart.
var main = null, candle = null, vol = null, emaSeries = [], priceLines = [], subs = [], structKey = null, pending = null, dataKey = null;

function opts(dark, showTime) {
  return {
    layout: { background: { type: 'solid', color: dark ? '#0b0e14' : '#ffffff' }, textColor: dark ? '#9aa4b2' : '#4a5568' },
    grid: { vertLines: { color: dark ? '#141a25' : '#eef0f3' }, horzLines: { color: dark ? '#141a25' : '#eef0f3' } },
    rightPriceScale: { borderColor: dark ? '#1c2230' : '#e2e5ea', scaleMargins: { top: 0.08, bottom: 0.08 } },
    // rightOffset leaves ~8 bars of space so the newest candle isn't jammed against the price axis
    // + its labels. FIXED barSpacing → bar thickness stays constant across timeframes (fitContent
    // squeezed all bars to fill the width, so Daily drew thick and 1H thin); scroll for history.
    timeScale: { borderColor: dark ? '#1c2230' : '#e2e5ea', timeVisible: true, secondsVisible: false, visible: !!showTime, rightOffset: 8, barSpacing: 7 },
    // Crosshair fully hidden: the page is a PURE RENDERER (2026-07-06 fully-native redesign) —
    // no DOM input can move a crosshair, and the cross-pane sync that could leave one stuck is
    // deleted. The OHLC readout always shows the last bar.
    crosshair: { vertLine: { visible: false, labelVisible: false }, horzLine: { visible: false, labelVisible: false } }, autoSize: true,
    // FULLY NATIVE TOUCH (2026-07-06): every chart touch is owned by ONE UIKit recognizer in
    // WebChartView, which routes by zone (body pan/pinch, price-axis stretch, time-axis stretch,
    // divider resize) and drives the chart through the window.native* API below. ALL of LWC's
    // own touch handling is OFF — the previous hybrid split (native pan/pinch + DOM for the
    // rest) caused every gesture bug this chart ever had: UIKit arbitration killed the pinch,
    // DOM vertTouchDrag silently disabled autoscale mid-gesture, and the crosshair sync locked
    // a stuck cursor when touches ended in a cancel.
    handleScroll: { mouseWheel: true, pressedMouseMove: false, horzTouchDrag: false, vertTouchDrag: false },
    handleScale: { mouseWheel: true, pinch: false, axisPressedMouseMove: { time: false, price: false }, axisDoubleClickReset: false },
    kineticScroll: { touch: false, mouse: false },
  };
}
function clean(pts) { return (pts || []).filter(function (p) { return p && isFinite(p.value); }); }
// Pad a (tail-aligned) series with leading whitespace points so its bar-index set matches the
// candle series exactly — required for logical-range pane sync to mean the same bar everywhere.
function padToTimes(pts, allTimes) {
  if (!pts.length || !allTimes.length) return pts;
  var first = pts[0].time, pad = [];
  for (var i = 0; i < allTimes.length && allTimes[i] < first; i++) pad.push({ time: allTimes[i] });
  return pad.concat(pts);
}
function structKeyOf(p) { return (p.dark ? 'd' : 'l') + '|' + (p.subpanels || []).map(function (s) { return s.id; }).join(','); }

// Build the chart + pane skeleton (persistent series). Called only when structKey changes.
function buildStructure(p) {
  [main].concat(subs.map(function (s) { return s.chart; })).forEach(function (c) { if (c) { try { c.remove(); } catch (e) {} } });
  emaSeries = []; priceLines = []; subs = []; main = null; candle = null; vol = null;
  var container = document.getElementById('container');
  Array.prototype.slice.call(container.querySelectorAll('.sub')).forEach(function (d) { container.removeChild(d); });

  var dark = !!p.dark, sp = p.subpanels || [];
  main = LightweightCharts.createChart(document.getElementById('main'), opts(dark, sp.length === 0));
  // autoscaleInfoProvider: when the native VERTICAL pinch has set a custom viewport (vRange),
  // serve it through the autoscale path — LWC has no public price-range setter, so this is the
  // supported way to drive the vertical zoom. vRange null → stock autoscale.
  candle = main.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    autoscaleInfoProvider: acProvider });
  vol = main.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
  main.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  // 3 persistent EMA line series (index-stable; setData empty when a series is absent).
  ['#5b8def', '#f0a020', '#b06be8'].forEach(function (col) {
    emaSeries.push(main.addLineSeries({ color: col, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }));
  });

  var chartsForSync = [main];
  var paneEls = [document.getElementById('main')];
  sp.forEach(function (spec, idx) {
    var div = document.createElement('div'); div.className = 'pane sub';
    var lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = spec.id; div.appendChild(lbl);
    container.appendChild(div);
    paneEls.push(div);
    var c = LightweightCharts.createChart(div, opts(dark, idx === sp.length - 1));
    var pf = { type: 'price', precision: spec.precision || 1, minMove: Math.pow(10, -(spec.precision || 1)) };
    var entry = { chart: c, hist: null, lines: [], name: spec.id, precision: spec.precision || 1, lblEl: lbl, valueMaps: [] };
    if (spec.histogram != null) entry.hist = c.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false, priceFormat: pf });
    (spec.lines || []).forEach(function (ln, i) {
      var ls = c.addLineSeries({ color: ln.color, lineWidth: ln.width, priceLineVisible: false, lastValueVisible: i === 0, crosshairMarkerVisible: false, priceFormat: pf });
      entry.lines.push(ls);
      if (i === 0 && spec.guides) spec.guides.forEach(function (g) { ls.createPriceLine({ price: g, color: '#2c3b4a', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: String(g) }); });
    });
    subs.push(entry); chartsForSync.push(c);
  });

  // Sync panes by LOGICAL range (bar indices) — the cheap, exact path. Time-based sync
  // (setVisibleRange) converted time→bars on every frame of a pan/pinch and snapped to bar
  // boundaries, which stuttered and rubber-banded the gesture on every time-scale change.
  // Sub-series are whitespace-padded to the full candle range (padToTimes) so logical index
  // N means the same bar in every pane.
  //
  // rAF-coalesced: applying the range to the other panes SYNCHRONOUSLY inside every range
  // event made the gestured pane wait for 2+ full sub-pane re-renders per touch event —
  // visible jitter on one-finger drags. Instead, stash the latest range and apply it once
  // per display frame: the gestured pane pans at full rate, followers trail by ≤1 frame.
  var syncing = false, pendingRange = null, pendingSrc = null, rafId = null;
  function applySync() {
    rafId = null;
    var r = pendingRange, src = pendingSrc;
    pendingRange = null; pendingSrc = null;
    if (!r) return;
    syncing = true;
    chartsForSync.forEach(function (dst) { if (dst !== src) { try { dst.timeScale().setVisibleLogicalRange(r); } catch (e) {} } });
    syncing = false;
  }
  chartsForSync.forEach(function (src) {
    src.timeScale().subscribeVisibleLogicalRangeChange(function (r) {
      if (syncing || !r) return;
      pendingRange = r; pendingSrc = src;
      if (rafId == null) rafId = requestAnimationFrame(applySync);
    });
  });
  installDividers(paneEls);

  requestAnimationFrame(reportGeom);
}

// ── OHLC / sub-pane readouts ────────────────────────────────────────────────────────────────
// candleMap/volMap: time → bar/volume for the OHLC readout. Each sub-pane keeps valueMaps
// (time → per-line values) for its label readout. With the crosshair removed (fully-native
// redesign), the readouts always show the LAST bar; renderReadouts keeps its `t` parameter
// in case a native inspect gesture ever returns.
var candleArr = [], candleMap = {}, volMap = {};

function fmtVol(v) {
  if (!isFinite(v) || v <= 0) return '';
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return String(Math.round(v));
}

// Render the OHLC row + each sub-pane's value readout for bar time `t` (null → last bar).
function renderReadouts(t) {
  var el = document.getElementById('ohlc');
  if (!el) {
    el = document.createElement('div'); el.id = 'ohlc';
    var m = document.getElementById('main'); if (!m) return;
    m.appendChild(el);
  }
  var key = t != null ? t : (candleArr.length ? candleArr[candleArr.length - 1].time : null);
  var bar = key != null ? candleMap[key] : null;
  if (!bar) { el.textContent = ''; return; }
  var idx = candleArr.indexOf(bar);
  var prev = idx > 0 ? candleArr[idx - 1] : null;
  var ref = prev ? prev.close : bar.open;
  var chg = ref ? ((bar.close - ref) / ref) * 100 : 0;
  var up = bar.close >= ref;
  var cc = up ? '#26a69a' : '#ef5350';
  var f = formatDrawPrice;
  var vol = volMap[key];
  el.innerHTML = 'O <b style="color:' + cc + '">' + f(bar.open) + '</b> H <b style="color:' + cc + '">' + f(bar.high)
    + '</b> L <b style="color:' + cc + '">' + f(bar.low) + '</b> C <b style="color:' + cc + '">' + f(bar.close)
    + '</b> <b style="color:' + cc + '">' + (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%</b>'
    + (vol != null ? ' · V <b>' + fmtVol(vol) + '</b>' : '');

  subs.forEach(function (e2) {
    if (!e2.lblEl) return;
    var parts = [e2.name];
    (e2.valueMaps || []).forEach(function (vm, i) {
      var v = key != null ? vm.map[key] : undefined;
      if (v == null && candleArr.length && key == null) v = vm.last;
      if (v != null && isFinite(v)) parts.push('<b style="color:' + vm.color + '">' + v.toFixed(e2.precision) + '</b>');
    });
    e2.lblEl.innerHTML = parts.join(' ');
  });
}

// ── Native gesture bridge (the page's ONLY input surface) ──────────────────────────────────
// Called by WebChartView's single zone-routed recognizer. All operate on the MAIN chart; the
// rAF pane sync mirrors the sub-panes. CSS px == UIKit points (viewport width=device-width).

// Set the visible logical range, clamped so the view can never lose the data entirely —
// an unclamped fling/zoom could scroll past every bar and leave a blank chart.
function setRangeClamped(from, to) {
  var n = candleTimes.length;
  if (n > 1) {
    var W = to - from;
    if (to < 2) { to = 2; from = to - W; }             // over-scrolled left of the data
    if (from > n - 2) { from = n - 2; to = from + W; } // over-scrolled right of the data
  }
  try { main.timeScale().setVisibleLogicalRange({ from: from, to: to }); } catch (e) {}
}

// Width of the chart PANE (bars area). NEVER use timeScale().width() for this: it reports the
// TIME AXIS element's width, which is 0 whenever the main pane's axis is hidden (always, when
// sub-panels are enabled — the bottom pane owns the shared axis). That zero silently no-op'd
// every time-scale gesture behind the w<10 guards.
function paneW() {
  try { var ps = main.paneSize(); if (ps && ps.width >= 10) return ps.width; } catch (e) {}
  try {
    var el = document.getElementById('main');
    if (el) return Math.max(0, el.clientWidth - (main.priceScale('right').width() || 0));
  } catch (e) {}
  return 0;
}

function panByPx(dx) {
  if (!main) return;
  var ts = main.timeScale();
  var r = ts.getVisibleLogicalRange(); if (!r) return;
  var w = paneW();
  if (w < 10) return;
  var perBar = w / (r.to - r.from);
  var shift = dx / perBar;                       // drag right (dx>0) → view older bars
  setRangeClamped(r.from - shift, r.to - shift);
}
window.nativePanBy = function (dx) { if (isFinite(dx)) panByPx(dx); };

// Momentum glide after a native pan lifts (TradingView-style kinetic scroll).
var glide = { v: 0, raf: null, last: 0 };
window.nativeGlideStop = function () {
  if (glide.raf) cancelAnimationFrame(glide.raf);
  glide.raf = null; glide.v = 0;
};
function glideStep(ts) {
  glide.raf = null;
  var dt = Math.min(0.05, (ts - glide.last) / 1000); glide.last = ts;
  panByPx(glide.v * dt);
  glide.v *= Math.pow(0.1, dt);                  // ~10% of velocity remains after 1s
  if (Math.abs(glide.v) > 15) glide.raf = requestAnimationFrame(glideStep);
}
window.nativePanEnd = function (vx) {
  if (!main || !isFinite(vx) || Math.abs(vx) < 60) return;
  glide.v = Math.max(-6000, Math.min(6000, vx));   // cap flings — clamped range catches the rest
  glide.last = performance.now();
  glide.raf = requestAnimationFrame(glideStep);
};

// Pinch: TWO-AXIS zoom around the focal point (TradingView-style). Horizontal finger spread
// stretches the TIME scale; vertical spread stretches the PRICE scale. Scales are INCREMENTAL
// (Swift resets to 1 after every event), so repeated calls compose. Swift decomposes the raw
// pinch by finger-line orientation: scaleT = time component, scaleP = price component.
var vRange = null;   // custom vertical viewport {min,max}, served via autoscaleInfoProvider
function acProvider(orig) { return vRange ? { priceRange: { minValue: vRange.min, maxValue: vRange.max } } : orig(); }
// Set/clear the custom vertical viewport. While active, the price-scale margins are zeroed so
// the served range maps EXACTLY to the pane (with the default 8% margins, re-anchoring from
// screen pixels each pinch event would re-apply the margins every frame and drift the zoom).
function setVRange(r2) {
  var had = !!vRange;
  vRange = r2;
  try {
    if (!had && r2) main.priceScale('right').applyOptions({ scaleMargins: { top: 0, bottom: 0 } });
    if (had && !r2) main.priceScale('right').applyOptions({ scaleMargins: { top: 0.08, bottom: 0.08 } });
    main.priceScale('right').applyOptions({ autoScale: true });
    // Re-applying the provider invalidates the price scale, forcing a re-query even when the
    // time range didn't move (the pure-vertical-pinch case).
    candle.applyOptions({ autoscaleInfoProvider: acProvider });
  } catch (e) {}
}
window.nativePinch = function (centerX, centerY, scaleT, scaleP) {
  if (!main || !candle) return;
  // ── time axis ──
  if (isFinite(centerX) && scaleT > 0 && isFinite(scaleT) && scaleT !== 1) {
    var ts = main.timeScale();
    var r = ts.getVisibleLogicalRange();
    var w = paneW();
    if (r && w >= 10) {                        // pane not laid out yet — a 0 width would
      var W = r.to - r.from;                        // produce a zero-bar range (blank chart)
      var minW = Math.max(3, w / 50), maxW = w / 0.5; // barSpacing clamp [0.5, 50] px
      var W2 = Math.min(maxW, Math.max(minW, W / scaleT));
      var f = Math.min(1, Math.max(0, centerX / w));
      var center = r.from + f * W;
      var from2 = center - f * W2;
      setRangeClamped(from2, from2 + W2);
    }
  }
  // ── price axis ──
  if (isFinite(centerY) && scaleP > 0 && isFinite(scaleP) && scaleP !== 1) {
    try {
      var paneH = (main.paneSize() || {}).height || 0;
      if (paneH >= 10) {
        // (Re-)anchor the viewport to what's on screen RIGHT NOW — works from stock
        // autoscale, a prior vRange, or a prior axis stretch.
        var top = candle.coordinateToPrice(0), bot = candle.coordinateToPrice(paneH);
        if (top != null && bot != null && top > bot) {
          var fp = candle.coordinateToPrice(Math.min(paneH, Math.max(0, centerY)));
          if (fp == null) fp = (top + bot) / 2;
          var min2 = fp - (fp - bot) / scaleP;
          var max2 = fp + (top - fp) / scaleP;
          if (max2 - min2 > 1e-12) setVRange({ min: min2, max: max2 });
        }
      }
    } catch (e) {}
  }
};


// Price-axis drag: stretch the price scale around the pane-center price (factor per event,
// composed). Uses the same re-anchor-from-screen pattern as the pinch's price branch.
window.nativePriceStretch = function (factor) {
  if (!main || !candle || !(factor > 0) || !isFinite(factor) || factor === 1) return;
  try {
    var paneH = (main.paneSize() || {}).height || 0;
    if (paneH < 10) return;
    var top = candle.coordinateToPrice(0), bot = candle.coordinateToPrice(paneH);
    if (top == null || bot == null || top <= bot) return;
    var mid = (top + bot) / 2, half = ((top - bot) / 2) * factor;
    if (half > 1e-12) setVRange({ min: mid - half, max: mid + half });
  } catch (e) {}
};

// Time-axis drag: stretch bar spacing with the RIGHT EDGE anchored (TradingView semantics —
// the newest bar stays put while history compresses/expands).
window.nativeTimeStretch = function (factor) {
  if (!main || !(factor > 0) || !isFinite(factor) || factor === 1) return;
  var ts = main.timeScale();
  var r = ts.getVisibleLogicalRange(); if (!r) return;
  var w = paneW(); if (w < 10) return;
  var W = r.to - r.from;
  var minW = Math.max(3, w / 50), maxW = w / 0.5;   // same barSpacing clamps as nativePinch
  var W2 = Math.min(maxW, Math.max(minW, W * factor));
  setRangeClamped(r.to - W2, r.to);
};

// Divider drag (native): shift flex-grow between pane i and pane i+1 by dy points.
window.nativeDividerDrag = function (i, dy) {
  if (!isFinite(dy) || !isFinite(i)) return;
  var container = document.getElementById('container');
  var panes = container.querySelectorAll('.pane');
  var above = panes[i], below = panes[i + 1];
  if (!above || !below) return;
  var h = container.clientHeight || 1;
  var total = 0;
  Array.prototype.forEach.call(panes, function (q) { total += parseFloat(q.style.flexGrow || '1'); });
  var dGrow = (dy / h) * total;
  var MIN = 0.25;   // a pane can't shrink below this share
  var a = parseFloat(above.style.flexGrow || '1') + dGrow;
  var b = parseFloat(below.style.flexGrow || '1') - dGrow;
  if (a < MIN || b < MIN) return;
  above.style.flexGrow = a; below.style.flexGrow = b;
};
window.nativeDividerEnd = function () { requestAnimationFrame(reportGeom); };

// Reset (⟲ is a native SwiftUI button now): autoscale, default bar spacing, newest bar.
window.nativeReset = function () { resetView(); };

// Debug probe: time-scale state, returned to Swift by DEBUG evaluateGesture calls.
window.__dbgProbe = function () {
  try {
    var r = main ? main.timeScale().getVisibleLogicalRange() : null;
    return JSON.stringify({ from: r && r.from, to: r && r.to, w: main ? main.timeScale().width() : -1, n: candleTimes.length });
  } catch (e) { return 'probe-err ' + e; }
};

// Gesture telemetry badge (driven by Swift DEBUG builds only — never called in Release).
window.gestureDebug = function (msg) {
  var el = document.getElementById('gdbg');
  if (!el) {
    el = document.createElement('div'); el.id = 'gdbg';
    el.style.cssText = 'position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:9;'
      + 'background:rgba(0,0,0,0.65);color:#7fd4a8;font:10px ui-monospace,monospace;'
      + 'padding:2px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
};

// Drawing tools were REMOVED 2026-07-06 (unusable on device; recoverable at f07d762..a6c650b).
var candleTimes = [];         // main-pane candle times (unix seconds), set on every update()

var curPrecision = 2;
function formatDrawPrice(p) { return isFinite(p) ? p.toFixed(curPrecision) : ''; }

// Push the layout geometry to Swift — the native recognizer ROUTES touches by zone (price
// axis, time axis, divider index, body). Called after structure/data/divider/resize changes.
function reportGeom() {
  try {
    if (!window.webkit || !webkit.messageHandlers || !webkit.messageHandlers.chartGeom || !main) return;
    var rect = function (el) { var r = el.getBoundingClientRect(); return { top: r.top, height: r.height }; };
    var charts = [main].concat(subs.map(function (s) { return s.chart; }));
    webkit.messageHandlers.chartGeom.postMessage({
      priceAxisW: main.priceScale('right').width() || 0,
      timeAxisH: (charts[charts.length - 1].timeScale().height()) || 0,
      panes: Array.prototype.map.call(document.querySelectorAll('#container .pane'), rect),
      dividers: Array.prototype.map.call(document.querySelectorAll('#container .divider'), rect),
    });
  } catch (e) { /* native gating falls back to permissive defaults */ }
}
window.addEventListener('resize', function () { requestAnimationFrame(reportGeom); });

// Re-enable autoscale on every pane, restore the default bar spacing AND the default pane
// split (3:1:…), snap to the newest bar — ⟲ must recover from ANY state, including panes
// accidentally resized toward the minimum share.
function resetView() {
  if (!main) return;
  setVRange(null);   // drop the pinch-zoomed vertical viewport (also restores scale margins)
  [main].concat(subs.map(function (s) { return s.chart; })).forEach(function (c) {
    try { c.priceScale('right').applyOptions({ autoScale: true }); } catch (e) {}
  });
  var panes = document.querySelectorAll('#container .pane');
  Array.prototype.forEach.call(panes, function (q, i) { q.style.flexGrow = (i === 0 ? '3' : '1'); });
  try { main.timeScale().applyOptions({ barSpacing: 7, rightOffset: 8 }); } catch (e) {}
  main.timeScale().scrollToRealTime();
  requestAnimationFrame(reportGeom);
}

// Insert the divider strips between panes (visuals + geometry only — the DRAG is native:
// WebChartView routes divider-zone touches to nativeDividerDrag above). flex-grow is relative,
// so the split survives rotation / screen-size changes.
function installDividers(paneEls) {
  var container = document.getElementById('container');
  Array.prototype.slice.call(container.querySelectorAll('.divider')).forEach(function (d) { container.removeChild(d); });
  paneEls.forEach(function (el, i) { el.style.flexGrow = (i === 0 ? '3' : '1'); el.style.flexBasis = '0'; });
  for (var i = 1; i < paneEls.length; i++) {
    var div = document.createElement('div'); div.className = 'divider';
    container.insertBefore(div, paneEls[i]);
  }
}

// Update data on the existing series (no teardown → no flash; preserves the user's zoom).
function update(p, fit) {
  var data = (p.candles || []).map(function (c) { return { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close }; })
                              .sort(function (a, b) { return a.time - b.time; });
  candle.setData(data);
  if (!data.length) return;
  candle.applyOptions({ priceFormat: { type: 'price', precision: p.precision || 2, minMove: Math.pow(10, -(p.precision || 2)) } });
  curPrecision = p.precision || 2;
  // Log/linear price scale (main pane only; sub-panels are oscillators).
  try { main.priceScale('right').applyOptions({ mode: p.logScale ? 1 : 0 }); } catch (e) {}
  // Crosshair readout maps.
  candleArr = data; candleMap = {}; volMap = {};
  data.forEach(function (c) { candleMap[c.time] = c; });
  (p.volume || []).forEach(function (v) { volMap[v.time] = v.value; });

  var lines = p.lines || [];
  emaSeries.forEach(function (s, i) { s.setData(lines[i] ? clean(lines[i].points) : []); });
  vol.setData(p.volume || []);

  // EMA legend (top-left of the price pane) — only entries that actually have data.
  var legend = document.getElementById('legend');
  if (!legend) {
    legend = document.createElement('div'); legend.id = 'legend';
    document.getElementById('main').appendChild(legend);
  }
  legend.innerHTML = '';
  lines.forEach(function (ln) {
    if (!ln || !clean(ln.points).length) return;
    var s = document.createElement('span');
    s.style.color = ln.color; s.textContent = ln.label || '';
    legend.appendChild(s);
  });

  // Price lines are overlays on the persistent candle series — remove + re-add (no full-chart flash).
  priceLines.forEach(function (pl) { try { candle.removePriceLine(pl); } catch (e) {} });
  priceLines = [];
  (p.priceLines || []).forEach(function (l) {
    priceLines.push(candle.createPriceLine({ price: l.price, color: l.color, lineWidth: 1, lineStyle: l.dashed ? 2 : 0, axisLabelVisible: true, title: l.title }));
  });

  var allTimes = data.map(function (c) { return c.time; });
  candleTimes = allTimes;   // setRangeClamped bounds panning through this
  (p.subpanels || []).forEach(function (spec, idx) {
    var e = subs[idx]; if (!e) return;
    if (e.hist && spec.histogram) e.hist.setData(padToTimes(spec.histogram, allTimes));
    e.valueMaps = [];
    (spec.lines || []).forEach(function (ln, i) {
      var pts = clean(ln.points);
      if (e.lines[i]) e.lines[i].setData(padToTimes(pts, allTimes));
      var m = {};
      pts.forEach(function (q) { m[q.time] = q.value; });
      e.valueMaps.push({ color: ln.color, map: m, last: pts.length ? pts[pts.length - 1].value : null });
    });
  });
  renderReadouts(null);

  // Reset the view when the DATA IDENTITY (symbol|timeframe) changes: the user's manual price
  // range / pan from the previous instrument would leave the new one off-screen entirely (e.g.
  // BTC ~60k manual range → ETH ~3k renders below the viewport). Re-enable autoscale on every
  // pane and snap to the newest bar. Also runs on a fresh structure build (fit=true), using
  // scrollToRealTime rather than fitContent to keep the fixed barSpacing.
  var key = (p.symbol || '') + '|' + (p.tf || '');
  var identityChanged = key !== dataKey; dataKey = key;
  if (fit || identityChanged) {
    setVRange(null);   // pinch-zoomed vertical viewport is per-instrument — drop it
    [main].concat(subs.map(function (s) { return s.chart; })).forEach(function (c) {
      try { c.priceScale('right').applyOptions({ autoScale: true }); } catch (e) {}
    });
    main.timeScale().scrollToRealTime();
  }
  requestAnimationFrame(reportGeom);   // price-axis width changes with label magnitude
}

function render(p) {
  document.body.style.background = p.dark ? '#0b0e14' : '#ffffff';
  var k = structKeyOf(p);
  if (k !== structKey) { buildStructure(p); structKey = k; update(p, true); }
  else { update(p, false); }
}

window.setChart = function (payload) {
  try {
    var p = (typeof payload === 'string') ? JSON.parse(payload) : payload;
    if (window.LightweightCharts && document.getElementById('main')) render(p);
    else pending = p;
  } catch (e) { /* best-effort */ }
};
window.addEventListener('load', function () { if (pending) { render(pending); pending = null; } });
</script>
</body>
</html>
