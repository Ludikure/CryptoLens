<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overscroll-behavior: none;
    font-family: -apple-system, system-ui, sans-serif; }
  /* touch-action:none — the page never scrolls/zooms natively; without this WebKit holds touches
     in gesture arbitration before handing them to the chart's DOM handlers (laggy drag starts). */
  #container { position: absolute; inset: 0; display: flex; flex-direction: column; touch-action: none; }
  .pane { position: relative; width: 100%; touch-action: none; }
  /* Fit-to-screen (TradingView-mobile style): the main chart + enabled sub-panels DIVIDE the
     container height proportionally (main 3 : each sub 1) rather than each sub taking a fixed
     height. So 0 panels → main fills; 2 panels → main ~60% / subs ~20% each; 4 panels → main ~43%
     / subs ~14% each. Always fits one screen → the page never needs to scroll → no gesture fight. */
  #main { flex: 3 1 0; min-height: 0; }
  .sub { flex: 1 1 0; min-height: 0; border-top: 1px solid #1c2230; }
  .lbl { position: absolute; top: 3px; left: 6px; font-size: 10px; color: #9aa4b2; z-index: 3; pointer-events: none; }
  /* EMA legend, top-left of the price pane (TradingView-style): colored name per overlay line. */
  #legend { position: absolute; top: 3px; left: 6px; z-index: 3; pointer-events: none;
    font-size: 10px; font-weight: 600; display: flex; gap: 10px; }
  #legend span::before { content: '—'; margin-right: 3px; font-weight: 700; }
  /* Reset button: re-enable autoscale + snap to the newest bar (replaces axis double-tap reset,
     which WKWebView kept mis-triggering during fast drags). Sits left of the price axis. */
  #resetBtn { position: absolute; right: 68px; bottom: 10px; z-index: 6; width: 32px; height: 32px;
    border-radius: 16px; background: rgba(58,70,88,0.85); color: #cfd6e4; font-size: 17px;
    line-height: 32px; text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  /* Drag handle between panes (TradingView-style): drag to grow one pane / shrink its neighbor.
     10px transparent strip with a visible grip; touch-action:none so the drag doesn't scroll/pan. */
  .divider { flex: 0 0 11px; background: transparent; cursor: row-resize; touch-action: none;
    position: relative; z-index: 5; }
  .divider::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 34px; height: 3px; border-radius: 2px; background: #6b7787; }
</style>
<script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="container">
  <div id="main" class="pane"></div>
</div>
<script>
// Multi-pane port of web/src/components/{ChartPanel,SubPanels}.tsx. window.setChart(payload) is
// called by the Swift side (WebChartView).
//
// FLASH FIX (2026-07-03): the charts are built ONCE and data is updated IN PLACE (setData) on
// subsequent payloads. They are torn down + rebuilt only when the STRUCTURE changes (theme or the
// enabled sub-panel set). Previously every payload did chart.remove()+recreate, so the several
// staged payloads on first launch (cached → indicators → ML → analysis) flashed the chart.
var main = null, candle = null, vol = null, emaSeries = [], priceLines = [], subs = [], structKey = null, pending = null, dataKey = null;

function opts(dark, showTime) {
  return {
    layout: { background: { type: 'solid', color: dark ? '#0b0e14' : '#ffffff' }, textColor: dark ? '#9aa4b2' : '#4a5568' },
    grid: { vertLines: { color: dark ? '#141a25' : '#eef0f3' }, horzLines: { color: dark ? '#141a25' : '#eef0f3' } },
    rightPriceScale: { borderColor: dark ? '#1c2230' : '#e2e5ea', scaleMargins: { top: 0.08, bottom: 0.08 } },
    // rightOffset leaves ~8 bars of space so the newest candle isn't jammed against the price axis
    // + its labels. FIXED barSpacing → bar thickness stays constant across timeframes (fitContent
    // squeezed all bars to fill the width, so Daily drew thick and 1H thin); scroll for history.
    timeScale: { borderColor: dark ? '#1c2230' : '#e2e5ea', timeVisible: true, secondsVisible: false, visible: !!showTime, rightOffset: 8, barSpacing: 7 },
    crosshair: { mode: 0 }, autoSize: true,
    // TradingView-grade touch (hybrid native/DOM). The two hot gestures are handled by NATIVE
    // UIKit recognizers (WebChartView) that call nativePanBy/nativePinch below — WebKit's DOM
    // touch pipeline adds coalescing + IPC latency that reads as lag/jitter:
    //  - chart body, one finger horizontal → NATIVE bar pan (+ momentum glide)
    //  - two fingers on the body           → NATIVE pinch-zoom around the focal point
    // Still DOM (they already feel right):
    //  - chart body, one finger vertical   → price-scale pan (vertTouchDrag ON)
    //  - PRICE / TIME axis drag            → stretch/compress that scale
    //  - long-press → crosshair scrub; divider drag → pane resize
    handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: false, vertTouchDrag: true },
    // axisDoubleClickReset OFF: WKWebView misclassified fast drags as double-taps, causing surprise
    // scale resets mid-gesture. Reset lives on the explicit ⟲ button instead.
    handleScale: { mouseWheel: true, pinch: false, axisPressedMouseMove: { time: true, price: true }, axisDoubleClickReset: false },
    kineticScroll: { touch: true, mouse: false },
  };
}
function clean(pts) { return (pts || []).filter(function (p) { return p && isFinite(p.value); }); }
// Pad a (tail-aligned) series with leading whitespace points so its bar-index set matches the
// candle series exactly — required for logical-range pane sync to mean the same bar everywhere.
function padToTimes(pts, allTimes) {
  if (!pts.length || !allTimes.length) return pts;
  var first = pts[0].time, pad = [];
  for (var i = 0; i < allTimes.length && allTimes[i] < first; i++) pad.push({ time: allTimes[i] });
  return pad.concat(pts);
}
function structKeyOf(p) { return (p.dark ? 'd' : 'l') + '|' + (p.subpanels || []).map(function (s) { return s.id; }).join(','); }

// Build the chart + pane skeleton (persistent series). Called only when structKey changes.
function buildStructure(p) {
  [main].concat(subs.map(function (s) { return s.chart; })).forEach(function (c) { if (c) { try { c.remove(); } catch (e) {} } });
  emaSeries = []; priceLines = []; subs = []; main = null; candle = null; vol = null;
  var container = document.getElementById('container');
  Array.prototype.slice.call(container.querySelectorAll('.sub')).forEach(function (d) { container.removeChild(d); });

  var dark = !!p.dark, sp = p.subpanels || [];
  main = LightweightCharts.createChart(document.getElementById('main'), opts(dark, sp.length === 0));
  candle = main.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350' });
  vol = main.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
  main.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  // 3 persistent EMA line series (index-stable; setData empty when a series is absent).
  ['#5b8def', '#f0a020', '#b06be8'].forEach(function (col) {
    emaSeries.push(main.addLineSeries({ color: col, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }));
  });

  var chartsForSync = [main];
  var paneEls = [document.getElementById('main')];
  sp.forEach(function (spec, idx) {
    var div = document.createElement('div'); div.className = 'pane sub';
    var lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = spec.id; div.appendChild(lbl);
    container.appendChild(div);
    paneEls.push(div);
    var c = LightweightCharts.createChart(div, opts(dark, idx === sp.length - 1));
    var pf = { type: 'price', precision: spec.precision || 1, minMove: Math.pow(10, -(spec.precision || 1)) };
    var entry = { chart: c, hist: null, lines: [] };
    if (spec.histogram != null) entry.hist = c.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false, priceFormat: pf });
    (spec.lines || []).forEach(function (ln, i) {
      var ls = c.addLineSeries({ color: ln.color, lineWidth: ln.width, priceLineVisible: false, lastValueVisible: i === 0, crosshairMarkerVisible: false, priceFormat: pf });
      entry.lines.push(ls);
      if (i === 0 && spec.guides) spec.guides.forEach(function (g) { ls.createPriceLine({ price: g, color: '#2c3b4a', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: String(g) }); });
    });
    subs.push(entry); chartsForSync.push(c);
  });

  // Sync panes by LOGICAL range (bar indices) — the cheap, exact path. Time-based sync
  // (setVisibleRange) converted time→bars on every frame of a pan/pinch and snapped to bar
  // boundaries, which stuttered and rubber-banded the gesture on every time-scale change.
  // Sub-series are whitespace-padded to the full candle range (padToTimes) so logical index
  // N means the same bar in every pane.
  //
  // rAF-coalesced: applying the range to the other panes SYNCHRONOUSLY inside every range
  // event made the gestured pane wait for 2+ full sub-pane re-renders per touch event —
  // visible jitter on one-finger drags. Instead, stash the latest range and apply it once
  // per display frame: the gestured pane pans at full rate, followers trail by ≤1 frame.
  var syncing = false, pendingRange = null, pendingSrc = null, rafId = null;
  function applySync() {
    rafId = null;
    var r = pendingRange, src = pendingSrc;
    pendingRange = null; pendingSrc = null;
    if (!r) return;
    syncing = true;
    chartsForSync.forEach(function (dst) { if (dst !== src) { try { dst.timeScale().setVisibleLogicalRange(r); } catch (e) {} } });
    syncing = false;
  }
  chartsForSync.forEach(function (src) {
    src.timeScale().subscribeVisibleLogicalRangeChange(function (r) {
      if (syncing || !r) return;
      pendingRange = r; pendingSrc = src;
      if (rafId == null) rafId = requestAnimationFrame(applySync);
    });
  });

  installDividers(paneEls);

  // ⟲ reset button on the main pane (autoscale + newest bar).
  var btn = document.getElementById('resetBtn');
  if (!btn) {
    btn = document.createElement('div'); btn.id = 'resetBtn'; btn.textContent = '⟲';
    document.getElementById('main').appendChild(btn);
    btn.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); resetView(); });
  }
  requestAnimationFrame(reportGeom);
}

// ── Native gesture bridge ────────────────────────────────────────────────────────────────
// Called by WebChartView's UIKit recognizers. All operate on the MAIN chart; the rAF pane
// sync mirrors the sub-panes. CSS px == UIKit points (viewport width=device-width).

function panByPx(dx) {
  if (!main) return;
  var ts = main.timeScale();
  var r = ts.getVisibleLogicalRange(); if (!r) return;
  var w = ts.width() || 1;
  var perBar = w / (r.to - r.from);
  var shift = dx / perBar;                       // drag right (dx>0) → view older bars
  ts.setVisibleLogicalRange({ from: r.from - shift, to: r.to - shift });
}
window.nativePanBy = function (dx) { if (isFinite(dx)) panByPx(dx); };

// Momentum glide after a native pan lifts (TradingView-style kinetic scroll).
var glide = { v: 0, raf: null, last: 0 };
window.nativeGlideStop = function () {
  if (glide.raf) cancelAnimationFrame(glide.raf);
  glide.raf = null; glide.v = 0;
};
function glideStep(ts) {
  glide.raf = null;
  var dt = Math.min(0.05, (ts - glide.last) / 1000); glide.last = ts;
  panByPx(glide.v * dt);
  glide.v *= Math.pow(0.1, dt);                  // ~10% of velocity remains after 1s
  if (Math.abs(glide.v) > 15) glide.raf = requestAnimationFrame(glideStep);
}
window.nativePanEnd = function (vx) {
  if (!main || !isFinite(vx) || Math.abs(vx) < 60) return;
  glide.v = vx; glide.last = performance.now();
  glide.raf = requestAnimationFrame(glideStep);
};

// Pinch: zoom the logical range around the focal point. `scale` is INCREMENTAL (Swift resets
// the recognizer's scale to 1 after every event), so repeated calls compose.
window.nativePinch = function (centerX, scale) {
  if (!main || !(scale > 0) || !isFinite(centerX)) return;
  var ts = main.timeScale();
  var r = ts.getVisibleLogicalRange(); if (!r) return;
  var w = ts.width() || 1;
  var W = r.to - r.from;
  var minW = Math.max(3, w / 50), maxW = w / 0.5; // barSpacing clamp [0.5, 50] px
  var W2 = Math.min(maxW, Math.max(minW, W / scale));
  var f = Math.min(1, Math.max(0, centerX / w));
  var center = r.from + f * W;
  var from2 = center - f * W2;
  ts.setVisibleLogicalRange({ from: from2, to: from2 + W2 });
};

// Push the layout geometry to Swift so native recognizers YIELD over the price axis, time
// axis, and dividers (those gestures stay DOM). Called after structure/data/divider changes.
function reportGeom() {
  try {
    if (!window.webkit || !webkit.messageHandlers || !webkit.messageHandlers.chartGeom || !main) return;
    var rect = function (el) { var r = el.getBoundingClientRect(); return { top: r.top, height: r.height }; };
    var charts = [main].concat(subs.map(function (s) { return s.chart; }));
    webkit.messageHandlers.chartGeom.postMessage({
      priceAxisW: main.priceScale('right').width() || 0,
      timeAxisH: (charts[charts.length - 1].timeScale().height()) || 0,
      panes: Array.prototype.map.call(document.querySelectorAll('#container .pane'), rect),
      dividers: Array.prototype.map.call(document.querySelectorAll('#container .divider'), rect),
    });
  } catch (e) { /* native gating falls back to permissive defaults */ }
}
window.addEventListener('resize', function () { requestAnimationFrame(reportGeom); });

// Re-enable autoscale on every pane, restore the default bar spacing, snap to the newest bar.
function resetView() {
  if (!main) return;
  [main].concat(subs.map(function (s) { return s.chart; })).forEach(function (c) {
    try { c.priceScale('right').applyOptions({ autoScale: true }); } catch (e) {}
  });
  try { main.timeScale().applyOptions({ barSpacing: 7, rightOffset: 8 }); } catch (e) {}
  main.timeScale().scrollToRealTime();
}

// Insert a drag handle between each pair of panes. Dragging shifts flex-grow from one pane to its
// neighbor (charts have autoSize → they resize automatically). TradingView-style: grow RSI and the
// candles shrink. flex-grow is relative, so the split survives rotation / screen-size changes.
function installDividers(paneEls) {
  var container = document.getElementById('container');
  Array.prototype.slice.call(container.querySelectorAll('.divider')).forEach(function (d) { container.removeChild(d); });
  paneEls.forEach(function (el, i) { el.style.flexGrow = (i === 0 ? '3' : '1'); el.style.flexBasis = '0'; });
  for (var i = 1; i < paneEls.length; i++) {
    var div = document.createElement('div'); div.className = 'divider';
    container.insertBefore(div, paneEls[i]);
    attachDividerDrag(div, paneEls[i - 1], paneEls[i], container);
  }
}

function attachDividerDrag(divider, above, below, container) {
  var dragging = false, lastY = 0;
  var MIN = 0.25; // a pane can't shrink below this share
  divider.addEventListener('pointerdown', function (e) {
    dragging = true; lastY = e.clientY;
    try { divider.setPointerCapture(e.pointerId); } catch (x) {}
    e.preventDefault();
  });
  divider.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var h = container.clientHeight || 1;
    var dy = e.clientY - lastY; lastY = e.clientY;
    var total = 0;
    Array.prototype.forEach.call(container.querySelectorAll('.pane'), function (p) { total += parseFloat(p.style.flexGrow || '1'); });
    var dGrow = (dy / h) * total;
    var a = parseFloat(above.style.flexGrow || '1') + dGrow;
    var b = parseFloat(below.style.flexGrow || '1') - dGrow;
    if (a < MIN || b < MIN) return;
    above.style.flexGrow = a; below.style.flexGrow = b;
  });
  function end(e) { if (dragging) { dragging = false; try { divider.releasePointerCapture(e.pointerId); } catch (x) {} requestAnimationFrame(reportGeom); } }
  divider.addEventListener('pointerup', end);
  divider.addEventListener('pointercancel', end);
}

// Update data on the existing series (no teardown → no flash; preserves the user's zoom).
function update(p, fit) {
  var data = (p.candles || []).map(function (c) { return { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close }; })
                              .sort(function (a, b) { return a.time - b.time; });
  candle.setData(data);
  if (!data.length) return;
  candle.applyOptions({ priceFormat: { type: 'price', precision: p.precision || 2, minMove: Math.pow(10, -(p.precision || 2)) } });

  var lines = p.lines || [];
  emaSeries.forEach(function (s, i) { s.setData(lines[i] ? clean(lines[i].points) : []); });
  vol.setData(p.volume || []);

  // EMA legend (top-left of the price pane) — only entries that actually have data.
  var legend = document.getElementById('legend');
  if (!legend) {
    legend = document.createElement('div'); legend.id = 'legend';
    document.getElementById('main').appendChild(legend);
  }
  legend.innerHTML = '';
  lines.forEach(function (ln) {
    if (!ln || !clean(ln.points).length) return;
    var s = document.createElement('span');
    s.style.color = ln.color; s.textContent = ln.label || '';
    legend.appendChild(s);
  });

  // Price lines are overlays on the persistent candle series — remove + re-add (no full-chart flash).
  priceLines.forEach(function (pl) { try { candle.removePriceLine(pl); } catch (e) {} });
  priceLines = [];
  (p.priceLines || []).forEach(function (l) {
    priceLines.push(candle.createPriceLine({ price: l.price, color: l.color, lineWidth: 1, lineStyle: l.dashed ? 2 : 0, axisLabelVisible: true, title: l.title }));
  });

  var allTimes = data.map(function (c) { return c.time; });
  (p.subpanels || []).forEach(function (spec, idx) {
    var e = subs[idx]; if (!e) return;
    if (e.hist && spec.histogram) e.hist.setData(padToTimes(spec.histogram, allTimes));
    (spec.lines || []).forEach(function (ln, i) { if (e.lines[i]) e.lines[i].setData(padToTimes(clean(ln.points), allTimes)); });
  });

  // Reset the view when the DATA IDENTITY (symbol|timeframe) changes: the user's manual price
  // range / pan from the previous instrument would leave the new one off-screen entirely (e.g.
  // BTC ~60k manual range → ETH ~3k renders below the viewport). Re-enable autoscale on every
  // pane and snap to the newest bar. Also runs on a fresh structure build (fit=true), using
  // scrollToRealTime rather than fitContent to keep the fixed barSpacing.
  var key = (p.symbol || '') + '|' + (p.tf || '');
  var identityChanged = key !== dataKey; dataKey = key;
  if (fit || identityChanged) {
    [main].concat(subs.map(function (s) { return s.chart; })).forEach(function (c) {
      try { c.priceScale('right').applyOptions({ autoScale: true }); } catch (e) {}
    });
    main.timeScale().scrollToRealTime();
  }
  requestAnimationFrame(reportGeom);   // price-axis width changes with label magnitude
}

function render(p) {
  document.body.style.background = p.dark ? '#0b0e14' : '#ffffff';
  var k = structKeyOf(p);
  if (k !== structKey) { buildStructure(p); structKey = k; update(p, true); }
  else { update(p, false); }
}

window.setChart = function (payload) {
  try {
    var p = (typeof payload === 'string') ? JSON.parse(payload) : payload;
    if (window.LightweightCharts && document.getElementById('main')) render(p);
    else pending = p;
  } catch (e) { /* best-effort */ }
};
window.addEventListener('load', function () { if (pending) { render(pending); pending = null; } });
</script>
</body>
</html>
