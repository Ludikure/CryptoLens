<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overscroll-behavior: none;
    font-family: -apple-system, system-ui, sans-serif; }
  /* touch-action:none — the page never scrolls/zooms natively; without this WebKit holds touches
     in gesture arbitration before handing them to the chart's DOM handlers (laggy drag starts). */
  #container { position: absolute; inset: 0; display: flex; flex-direction: column; touch-action: none; }
  .pane { position: relative; width: 100%; touch-action: none; }
  /* Fit-to-screen (TradingView-mobile style): the main chart + enabled sub-panels DIVIDE the
     container height proportionally (main 3 : each sub 1) rather than each sub taking a fixed
     height. So 0 panels → main fills; 2 panels → main ~60% / subs ~20% each; 4 panels → main ~43%
     / subs ~14% each. Always fits one screen → the page never needs to scroll → no gesture fight. */
  #main { flex: 3 1 0; min-height: 0; }
  .sub { flex: 1 1 0; min-height: 0; border-top: 1px solid #1c2230; }
  .lbl { position: absolute; top: 3px; left: 6px; font-size: 10px; color: #9aa4b2; z-index: 3; pointer-events: none; }
  /* EMA legend, top-left of the price pane (TradingView-style): colored name per overlay line. */
  #legend { position: absolute; top: 3px; left: 44px; z-index: 3; pointer-events: none;
    font-size: 10px; font-weight: 600; display: flex; gap: 10px; }
  #legend span::before { content: '—'; margin-right: 3px; font-weight: 700; }
  /* OHLC readout (TradingView-style): crosshair bar's values, or the last bar when idle. */
  #ohlc { position: absolute; top: 16px; left: 44px; z-index: 3; pointer-events: none;
    font-size: 10px; font-weight: 500; color: #9aa4b2; font-variant-numeric: tabular-nums; }
  #ohlc b { font-weight: 600; }
  .lbl { font-variant-numeric: tabular-nums; }
  /* Reset button: re-enable autoscale + snap to the newest bar (replaces axis double-tap reset,
     which WKWebView kept mis-triggering during fast drags). Sits left of the price axis. */
  #resetBtn { position: absolute; right: 68px; bottom: 10px; z-index: 6; width: 32px; height: 32px;
    border-radius: 16px; background: rgba(58,70,88,0.85); color: #cfd6e4; font-size: 17px;
    line-height: 32px; text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  /* Drawing toolbar (TradingView-style, left edge): trend line, horizontal line, delete. */
  #drawbar { position: absolute; left: 6px; top: 30px; z-index: 6; display: flex; flex-direction: column; gap: 6px; }
  #drawbar div { width: 32px; height: 32px; border-radius: 8px; background: rgba(58,70,88,0.85);
    color: #cfd6e4; font-size: 15px; line-height: 32px; text-align: center;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  #drawbar div.on { background: #5b8def; color: #fff; }
  #drawbar div.hidden { display: none; }
  /* Drag handle between panes (TradingView-style): drag to grow one pane / shrink its neighbor.
     10px transparent strip with a visible grip; touch-action:none so the drag doesn't scroll/pan. */
  .divider { flex: 0 0 11px; background: transparent; cursor: row-resize; touch-action: none;
    position: relative; z-index: 5; }
  .divider::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 34px; height: 3px; border-radius: 2px; background: #6b7787; }
</style>
<script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="container">
  <div id="main" class="pane"></div>
</div>
<script>
// Multi-pane port of web/src/components/{ChartPanel,SubPanels}.tsx. window.setChart(payload) is
// called by the Swift side (WebChartView).
//
// FLASH FIX (2026-07-03): the charts are built ONCE and data is updated IN PLACE (setData) on
// subsequent payloads. They are torn down + rebuilt only when the STRUCTURE changes (theme or the
// enabled sub-panel set). Previously every payload did chart.remove()+recreate, so the several
// staged payloads on first launch (cached → indicators → ML → analysis) flashed the chart.
var main = null, candle = null, vol = null, emaSeries = [], priceLines = [], subs = [], structKey = null, pending = null, dataKey = null;

function opts(dark, showTime) {
  return {
    layout: { background: { type: 'solid', color: dark ? '#0b0e14' : '#ffffff' }, textColor: dark ? '#9aa4b2' : '#4a5568' },
    grid: { vertLines: { color: dark ? '#141a25' : '#eef0f3' }, horzLines: { color: dark ? '#141a25' : '#eef0f3' } },
    rightPriceScale: { borderColor: dark ? '#1c2230' : '#e2e5ea', scaleMargins: { top: 0.08, bottom: 0.08 } },
    // rightOffset leaves ~8 bars of space so the newest candle isn't jammed against the price axis
    // + its labels. FIXED barSpacing → bar thickness stays constant across timeframes (fitContent
    // squeezed all bars to fill the width, so Daily drew thick and 1H thin); scroll for history.
    timeScale: { borderColor: dark ? '#1c2230' : '#e2e5ea', timeVisible: true, secondsVisible: false, visible: !!showTime, rightOffset: 8, barSpacing: 7 },
    crosshair: { mode: 0 }, autoSize: true,
    // TradingView-grade touch (hybrid native/DOM). The two hot gestures are handled by NATIVE
    // UIKit recognizers (WebChartView) that call nativePanBy/nativePinch below — WebKit's DOM
    // touch pipeline adds coalescing + IPC latency that reads as lag/jitter:
    //  - chart body, one finger horizontal → NATIVE bar pan (+ momentum glide)
    //  - two fingers on the body           → NATIVE pinch-zoom around the focal point
    // Still DOM (they already feel right):
    //  - chart body, one finger vertical   → price-scale pan (vertTouchDrag ON)
    //  - PRICE / TIME axis drag            → stretch/compress that scale
    //  - long-press → crosshair scrub; divider drag → pane resize
    handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: false, vertTouchDrag: true },
    // axisDoubleClickReset OFF: WKWebView misclassified fast drags as double-taps, causing surprise
    // scale resets mid-gesture. Reset lives on the explicit ⟲ button instead.
    handleScale: { mouseWheel: true, pinch: false, axisPressedMouseMove: { time: true, price: true }, axisDoubleClickReset: false },
    kineticScroll: { touch: true, mouse: false },
  };
}
function clean(pts) { return (pts || []).filter(function (p) { return p && isFinite(p.value); }); }
// Pad a (tail-aligned) series with leading whitespace points so its bar-index set matches the
// candle series exactly — required for logical-range pane sync to mean the same bar everywhere.
function padToTimes(pts, allTimes) {
  if (!pts.length || !allTimes.length) return pts;
  var first = pts[0].time, pad = [];
  for (var i = 0; i < allTimes.length && allTimes[i] < first; i++) pad.push({ time: allTimes[i] });
  return pad.concat(pts);
}
function structKeyOf(p) { return (p.dark ? 'd' : 'l') + '|' + (p.subpanels || []).map(function (s) { return s.id; }).join(','); }

// Build the chart + pane skeleton (persistent series). Called only when structKey changes.
function buildStructure(p) {
  [main].concat(subs.map(function (s) { return s.chart; })).forEach(function (c) { if (c) { try { c.remove(); } catch (e) {} } });
  emaSeries = []; priceLines = []; subs = []; main = null; candle = null; vol = null;
  var container = document.getElementById('container');
  Array.prototype.slice.call(container.querySelectorAll('.sub')).forEach(function (d) { container.removeChild(d); });

  var dark = !!p.dark, sp = p.subpanels || [];
  main = LightweightCharts.createChart(document.getElementById('main'), opts(dark, sp.length === 0));
  candle = main.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350' });
  vol = main.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol' });
  main.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  // 3 persistent EMA line series (index-stable; setData empty when a series is absent).
  ['#5b8def', '#f0a020', '#b06be8'].forEach(function (col) {
    emaSeries.push(main.addLineSeries({ color: col, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }));
  });

  var chartsForSync = [main];
  var paneEls = [document.getElementById('main')];
  sp.forEach(function (spec, idx) {
    var div = document.createElement('div'); div.className = 'pane sub';
    var lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = spec.id; div.appendChild(lbl);
    container.appendChild(div);
    paneEls.push(div);
    var c = LightweightCharts.createChart(div, opts(dark, idx === sp.length - 1));
    var pf = { type: 'price', precision: spec.precision || 1, minMove: Math.pow(10, -(spec.precision || 1)) };
    var entry = { chart: c, hist: null, lines: [], name: spec.id, precision: spec.precision || 1, lblEl: lbl, valueMaps: [] };
    if (spec.histogram != null) entry.hist = c.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false, priceFormat: pf });
    (spec.lines || []).forEach(function (ln, i) {
      var ls = c.addLineSeries({ color: ln.color, lineWidth: ln.width, priceLineVisible: false, lastValueVisible: i === 0, crosshairMarkerVisible: false, priceFormat: pf });
      entry.lines.push(ls);
      if (i === 0 && spec.guides) spec.guides.forEach(function (g) { ls.createPriceLine({ price: g, color: '#2c3b4a', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: String(g) }); });
    });
    subs.push(entry); chartsForSync.push(c);
  });

  // Sync panes by LOGICAL range (bar indices) — the cheap, exact path. Time-based sync
  // (setVisibleRange) converted time→bars on every frame of a pan/pinch and snapped to bar
  // boundaries, which stuttered and rubber-banded the gesture on every time-scale change.
  // Sub-series are whitespace-padded to the full candle range (padToTimes) so logical index
  // N means the same bar in every pane.
  //
  // rAF-coalesced: applying the range to the other panes SYNCHRONOUSLY inside every range
  // event made the gestured pane wait for 2+ full sub-pane re-renders per touch event —
  // visible jitter on one-finger drags. Instead, stash the latest range and apply it once
  // per display frame: the gestured pane pans at full rate, followers trail by ≤1 frame.
  var syncing = false, pendingRange = null, pendingSrc = null, rafId = null;
  function applySync() {
    rafId = null;
    var r = pendingRange, src = pendingSrc;
    pendingRange = null; pendingSrc = null;
    if (!r) return;
    syncing = true;
    chartsForSync.forEach(function (dst) { if (dst !== src) { try { dst.timeScale().setVisibleLogicalRange(r); } catch (e) {} } });
    syncing = false;
  }
  chartsForSync.forEach(function (src) {
    src.timeScale().subscribeVisibleLogicalRangeChange(function (r) {
      if (syncing || !r) return;
      pendingRange = r; pendingSrc = src;
      if (rafId == null) rafId = requestAnimationFrame(applySync);
    });
  });
  attachCrosshairSync(chartsForSync);

  installDividers(paneEls);

  // ⟲ reset button on the main pane (autoscale + newest bar).
  var btn = document.getElementById('resetBtn');
  if (!btn) {
    btn = document.createElement('div'); btn.id = 'resetBtn'; btn.textContent = '⟲';
    document.getElementById('main').appendChild(btn);
    btn.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); resetView(); });
  }

  // Drawings: primitive renders trend lines over the candles; price lines carry the hlines.
  // The chart was just rebuilt, so stale price-line handles are gone — re-sync from state.
  hlinePls = [];
  drawPrimitive = {
    attached: function (p) { requestRedraw = p.requestUpdate; },
    detached: function () { requestRedraw = function () {}; },
    updateAllViews: function () {},
    paneViews: function () {
      return [{ zOrder: function () { return 'top'; }, renderer: function () { return { draw: drawTrendsRenderer }; } }];
    },
  };
  try { candle.attachPrimitive(drawPrimitive); } catch (e) { /* pre-4.1 lib — trend lines unavailable */ }
  installDrawTools(document.getElementById('main'));
  syncHlines(); updateDrawbar();

  requestAnimationFrame(reportGeom);
}

// ── Crosshair readouts + cross-pane sync (TradingView-style) ────────────────────────────────
// candleMap/volMap: time → bar/volume for the OHLC readout. Each sub-pane keeps valueMaps
// (time → per-line values) for its label readout. Scrubbing ANY pane positions the crosshair
// on the same bar in every other pane.
var candleArr = [], candleMap = {}, volMap = {};
var xhSyncing = false;

function fmtVol(v) {
  if (!isFinite(v) || v <= 0) return '';
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return String(Math.round(v));
}

// Render the OHLC row + each sub-pane's value readout for bar time `t` (null → last bar).
function renderReadouts(t) {
  var el = document.getElementById('ohlc');
  if (!el) {
    el = document.createElement('div'); el.id = 'ohlc';
    var m = document.getElementById('main'); if (!m) return;
    m.appendChild(el);
  }
  var key = t != null ? t : (candleArr.length ? candleArr[candleArr.length - 1].time : null);
  var bar = key != null ? candleMap[key] : null;
  if (!bar) { el.textContent = ''; return; }
  var idx = candleArr.indexOf(bar);
  var prev = idx > 0 ? candleArr[idx - 1] : null;
  var ref = prev ? prev.close : bar.open;
  var chg = ref ? ((bar.close - ref) / ref) * 100 : 0;
  var up = bar.close >= ref;
  var cc = up ? '#26a69a' : '#ef5350';
  var f = formatDrawPrice;
  var vol = volMap[key];
  el.innerHTML = 'O <b style="color:' + cc + '">' + f(bar.open) + '</b> H <b style="color:' + cc + '">' + f(bar.high)
    + '</b> L <b style="color:' + cc + '">' + f(bar.low) + '</b> C <b style="color:' + cc + '">' + f(bar.close)
    + '</b> <b style="color:' + cc + '">' + (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%</b>'
    + (vol != null ? ' · V <b>' + fmtVol(vol) + '</b>' : '');

  subs.forEach(function (e2) {
    if (!e2.lblEl) return;
    var parts = [e2.name];
    (e2.valueMaps || []).forEach(function (vm, i) {
      var v = key != null ? vm.map[key] : undefined;
      if (v == null && candleArr.length && key == null) v = vm.last;
      if (v != null && isFinite(v)) parts.push('<b style="color:' + vm.color + '">' + v.toFixed(e2.precision) + '</b>');
    });
    e2.lblEl.innerHTML = parts.join(' ');
  });
}

// Position the crosshair on bar `t` in every chart except `src` (LWC 4.1+ API).
function syncCrosshair(srcChart, t) {
  var all = [{ chart: main, series: candle }].concat(subs.map(function (s) {
    return { chart: s.chart, series: s.lines[0] || s.hist };
  }));
  all.forEach(function (e) {
    if (!e.chart || e.chart === srcChart || !e.series) return;
    try {
      if (t == null) { e.chart.clearCrosshairPosition(); return; }
      var v = e.chart === main ? (candleMap[t] && candleMap[t].close) : null;
      if (e.chart !== main) {
        var s0 = subs.filter(function (s) { return s.chart === e.chart; })[0];
        var vm = s0 && s0.valueMaps && s0.valueMaps[0];
        v = vm ? vm.map[t] : null;
      }
      if (v != null && isFinite(v)) e.chart.setCrosshairPosition(v, t, e.series);
      else e.chart.clearCrosshairPosition();
    } catch (x) { /* pre-4.1 lib */ }
  });
}

function attachCrosshairSync(chartsForSync) {
  chartsForSync.forEach(function (c) {
    c.subscribeCrosshairMove(function (param) {
      if (xhSyncing) return;
      xhSyncing = true;
      var t = param && param.time != null ? param.time : null;
      // Only the chart under the finger drives; a null from it clears everywhere.
      if (param && (param.point || t == null)) {
        syncCrosshair(c, t);
        renderReadouts(t);
      }
      xhSyncing = false;
    });
  });
}

// ── Native gesture bridge ────────────────────────────────────────────────────────────────
// Called by WebChartView's UIKit recognizers. All operate on the MAIN chart; the rAF pane
// sync mirrors the sub-panes. CSS px == UIKit points (viewport width=device-width).

function panByPx(dx) {
  if (!main) return;
  var ts = main.timeScale();
  var r = ts.getVisibleLogicalRange(); if (!r) return;
  var w = ts.width() || 1;
  var perBar = w / (r.to - r.from);
  var shift = dx / perBar;                       // drag right (dx>0) → view older bars
  ts.setVisibleLogicalRange({ from: r.from - shift, to: r.to - shift });
}
window.nativePanBy = function (dx) { if (isFinite(dx)) panByPx(dx); };

// Momentum glide after a native pan lifts (TradingView-style kinetic scroll).
var glide = { v: 0, raf: null, last: 0 };
window.nativeGlideStop = function () {
  if (glide.raf) cancelAnimationFrame(glide.raf);
  glide.raf = null; glide.v = 0;
};
function glideStep(ts) {
  glide.raf = null;
  var dt = Math.min(0.05, (ts - glide.last) / 1000); glide.last = ts;
  panByPx(glide.v * dt);
  glide.v *= Math.pow(0.1, dt);                  // ~10% of velocity remains after 1s
  if (Math.abs(glide.v) > 15) glide.raf = requestAnimationFrame(glideStep);
}
window.nativePanEnd = function (vx) {
  if (!main || !isFinite(vx) || Math.abs(vx) < 60) return;
  glide.v = vx; glide.last = performance.now();
  glide.raf = requestAnimationFrame(glideStep);
};

// Pinch: zoom the logical range around the focal point. `scale` is INCREMENTAL (Swift resets
// the recognizer's scale to 1 after every event), so repeated calls compose.
window.nativePinch = function (centerX, scale) {
  if (!main || !(scale > 0) || !isFinite(centerX)) return;
  var ts = main.timeScale();
  var r = ts.getVisibleLogicalRange(); if (!r) return;
  var w = ts.width() || 1;
  var W = r.to - r.from;
  var minW = Math.max(3, w / 50), maxW = w / 0.5; // barSpacing clamp [0.5, 50] px
  var W2 = Math.min(maxW, Math.max(minW, W / scale));
  var f = Math.min(1, Math.max(0, centerX / w));
  var center = r.from + f * W;
  var from2 = center - f * W2;
  ts.setVisibleLogicalRange({ from: from2, to: from2 + W2 });
};

// ── Drawing tools (trend lines + horizontal lines) ──────────────────────────────────────────
// TradingView-style: pick a tool in #drawbar, drag on the chart to draw a trend line or tap to
// place a horizontal line. Tap a drawing to select it (handles appear); drag handles/body to
// edit; 🗑 deletes. Anchors are (unix-seconds, price) so drawings render on EVERY timeframe.
// Persisted per SYMBOL via the chartDrawings message → Swift UserDefaults → payload.drawings.
// While a tool is armed / something is selected, `drawingActive` is posted so the NATIVE pan
// and pinch recognizers yield and chart scroll/scale is paused — no gesture fights.
var drawings = [];            // [{type:'trend', p1:{t,price}, p2:{t,price}} | {type:'hline', price}]
var hlinePls = [];            // createPriceLine handles parallel to hline entries (by drawing index)
var drawTool = null;          // null | 'trend' | 'hline'
var selectedIdx = null;
var draggingDraw = null;      // {idx, part:'p1'|'p2'|'line'|'hline', startLogical, startPrice, orig}
var candleTimes = [];         // main-pane candle times (unix seconds), set on every update()
var curSymbol = '';
var drawPrimitive = null;
var requestRedraw = function () {};

function priceY(price) { return candle ? candle.priceToCoordinate(price) : null; }
function yPrice(y) { return candle ? candle.coordinateToPrice(y) : null; }

// time ↔ x via fractional logical index (binary search + linear interpolation between bars,
// extrapolation past either end) — robust across timeframes and to times between bars.
function timeLogical(t) {
  var n = candleTimes.length; if (!n) return null;
  if (n === 1) return 0;
  var last = n - 1;
  if (t <= candleTimes[0]) { var iv0 = candleTimes[1] - candleTimes[0] || 1; return (t - candleTimes[0]) / iv0; }
  if (t >= candleTimes[last]) { var ivl = candleTimes[last] - candleTimes[last - 1] || 1; return last + (t - candleTimes[last]) / ivl; }
  var lo = 0, hi = last;
  while (lo < hi) { var mid = (lo + hi) >> 1; if (candleTimes[mid] < t) lo = mid + 1; else hi = mid; }
  var t1 = candleTimes[lo - 1], t2 = candleTimes[lo];
  return (lo - 1) + (t - t1) / (t2 - t1 || 1);
}
function timeToX(t) {
  if (!main) return null;
  var l = timeLogical(t); if (l == null) return null;
  return main.timeScale().logicalToCoordinate(l);
}
function xToTime(x) {
  if (!main) return null;
  var l = main.timeScale().coordinateToLogical(x); if (l == null) return null;
  var n = candleTimes.length; if (!n) return null;
  var i = Math.round(l), last = n - 1;
  if (i >= 0 && i <= last) return candleTimes[i];
  var iv = n > 1 ? candleTimes[last] - candleTimes[last - 1] : 3600;
  if (i > last) return candleTimes[last] + (i - last) * iv;
  return candleTimes[0] + i * (n > 1 ? candleTimes[1] - candleTimes[0] : iv);
}

function distToSegment(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1, len2 = dx * dx + dy * dy;
  var u = len2 ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2)) : 0;
  var cx = x1 + u * dx, cy = y1 + u * dy;
  return Math.hypot(px - cx, py - cy);
}

var TWO_POINT = { trend: 1, fib: 1, rect: 1, ruler: 1 };
var FIB_LEVELS = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];

function fmtDur(sec) {
  var d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  if (d) return d + 'd' + (h ? ' ' + h + 'h' : '');
  if (h) return h + 'h' + (m ? ' ' + m + 'm' : '');
  return m + 'm';
}

function drawCoords(d) {
  var x1 = timeToX(d.p1.t), y1 = priceY(d.p1.price), x2 = timeToX(d.p2.t), y2 = priceY(d.p2.price);
  if (x1 == null || y1 == null || x2 == null || y2 == null) return null;
  return { x1: x1, y1: y1, x2: x2, y2: y2 };
}

// Hit-test a chart-space point against drawings. Selected drawing's handles take priority.
function hitTestDraw(pt) {
  if (selectedIdx != null && drawings[selectedIdx] && TWO_POINT[drawings[selectedIdx].type]) {
    var c0 = drawCoords(drawings[selectedIdx]);
    if (c0) {
      if (Math.hypot(pt.x - c0.x1, pt.y - c0.y1) <= 14) return { idx: selectedIdx, part: 'p1' };
      if (Math.hypot(pt.x - c0.x2, pt.y - c0.y2) <= 14) return { idx: selectedIdx, part: 'p2' };
    }
  }
  for (var i = drawings.length - 1; i >= 0; i--) {
    var d = drawings[i];
    if (d.type === 'trend') {
      var c = drawCoords(d); if (!c) continue;
      var e = c;
      if (d.ext) e = extendRay(c);
      if (distToSegment(pt.x, pt.y, c.x1, c.y1, e.x2, e.y2) <= 10) return { idx: i, part: 'line' };
    } else if (d.type === 'fib') {
      var cf = drawCoords(d); if (!cf) continue;
      if (distToSegment(pt.x, pt.y, cf.x1, cf.y1, cf.x2, cf.y2) <= 10) return { idx: i, part: 'line' };
      var lo = Math.min(cf.x1, cf.x2), hi = Math.max(cf.x1, cf.x2);
      if (pt.x >= lo - 4 && pt.x <= hi + 4) {
        for (var k = 0; k < FIB_LEVELS.length; k++) {
          var ly = cf.y2 + (cf.y1 - cf.y2) * FIB_LEVELS[k];
          if (Math.abs(pt.y - ly) <= 7) return { idx: i, part: 'line' };
        }
      }
    } else if (d.type === 'rect' || d.type === 'ruler') {
      var cr = drawCoords(d); if (!cr) continue;
      var l = Math.min(cr.x1, cr.x2), r = Math.max(cr.x1, cr.x2);
      var t = Math.min(cr.y1, cr.y2), b = Math.max(cr.y1, cr.y2);
      if (pt.x >= l - 8 && pt.x <= r + 8 && pt.y >= t - 8 && pt.y <= b + 8) return { idx: i, part: 'line' };
    } else {
      var y = priceY(d.price);
      if (y != null && Math.abs(pt.y - y) <= 10) return { idx: i, part: 'hline' };
    }
  }
  return null;
}

// Project a trend segment onward past p2 to the pane edge (ray / "extend right" mode).
function extendRay(c) {
  var w = 1e5;
  try { w = main.timeScale().width() || 1e5; } catch (e) {}
  var dx = c.x2 - c.x1, dy = c.y2 - c.y1;
  if (dx === 0) return { x2: c.x2, y2: dy >= 0 ? 1e5 : -1e5 };
  var xe = dx > 0 ? w : 0;
  var t = (xe - c.x1) / dx;
  return { x2: xe, y2: c.y1 + t * dy };
}

// Horizontal lines render as native price lines (axis label for free). Rebuilt on any change.
function syncHlines() {
  hlinePls.forEach(function (pl) { try { candle.removePriceLine(pl); } catch (e) {} });
  hlinePls = [];
  drawings.forEach(function (d, i) {
    if (d.type !== 'hline') { hlinePls.push(null); return; }
    var sel = i === selectedIdx;
    hlinePls.push(candle.createPriceLine({
      price: d.price, color: sel ? '#e6c84f' : '#5b8def', lineWidth: sel ? 2 : 1,
      lineStyle: 0, axisLabelVisible: true, title: '',
    }));
  });
}

function drawTrendsRenderer(target) {
  target.useMediaCoordinateSpace(function (scope) {
    var ctx = scope.context;
    ctx.font = '10px -apple-system, system-ui, sans-serif';
    drawings.forEach(function (d, i) {
      if (!TWO_POINT[d.type]) return;
      var c = drawCoords(d); if (!c) return;
      var sel = i === selectedIdx;
      var col = sel ? '#e6c84f' : '#5b8def';

      if (d.type === 'trend') {
        var e = d.ext ? extendRay(c) : c;
        ctx.lineWidth = sel ? 2 : 1.5;
        ctx.strokeStyle = col;
        ctx.beginPath(); ctx.moveTo(c.x1, c.y1); ctx.lineTo(e.x2, e.y2); ctx.stroke();
      } else if (d.type === 'rect') {
        var l = Math.min(c.x1, c.x2), t = Math.min(c.y1, c.y2);
        var w = Math.abs(c.x2 - c.x1), h = Math.abs(c.y2 - c.y1);
        ctx.fillStyle = sel ? 'rgba(230,200,79,0.10)' : 'rgba(91,141,239,0.10)';
        ctx.fillRect(l, t, w, h);
        ctx.lineWidth = sel ? 2 : 1;
        ctx.strokeStyle = col;
        ctx.strokeRect(l, t, w, h);
      } else if (d.type === 'ruler') {
        var rup = d.p2.price >= d.p1.price;
        var base = rup ? '38,166,154' : '239,83,80';
        var rl = Math.min(c.x1, c.x2), rt = Math.min(c.y1, c.y2);
        var rw = Math.abs(c.x2 - c.x1), rh = Math.abs(c.y2 - c.y1);
        ctx.fillStyle = 'rgba(' + base + ',0.14)';
        ctx.fillRect(rl, rt, rw, rh);
        // Direction arrow p1 → p2 with a small head.
        ctx.lineWidth = sel ? 2 : 1.5;
        ctx.strokeStyle = 'rgba(' + base + ',0.95)';
        ctx.beginPath(); ctx.moveTo(c.x1, c.y1); ctx.lineTo(c.x2, c.y2); ctx.stroke();
        var ang = Math.atan2(c.y2 - c.y1, c.x2 - c.x1);
        ctx.beginPath();
        ctx.moveTo(c.x2, c.y2);
        ctx.lineTo(c.x2 - 8 * Math.cos(ang - 0.4), c.y2 - 8 * Math.sin(ang - 0.4));
        ctx.moveTo(c.x2, c.y2);
        ctx.lineTo(c.x2 - 8 * Math.cos(ang + 0.4), c.y2 - 8 * Math.sin(ang + 0.4));
        ctx.stroke();
        // Stats pill: Δ% (Δprice) · bars · duration — above the box for up moves, below for down.
        var dp = d.p2.price - d.p1.price;
        var pct = d.p1.price ? (dp / d.p1.price) * 100 : 0;
        var bars = Math.abs(Math.round((timeLogical(d.p2.t) || 0) - (timeLogical(d.p1.t) || 0)));
        var label = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%  (' + formatDrawPrice(dp) + ')   '
                  + bars + ' bars   ' + fmtDur(Math.abs(d.p2.t - d.p1.t));
        var tw = ctx.measureText(label).width;
        var lx = rl + rw / 2 - tw / 2 - 7, lw2 = tw + 14;
        var ly = rup ? rt - 22 : rt + rh + 6;
        if (ly < 2) ly = rt + rh + 6;
        ctx.fillStyle = 'rgba(' + base + ',0.92)';
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(lx, ly, lw2, 16, 4); ctx.fill(); }
        else ctx.fillRect(lx, ly, lw2, 16);
        ctx.fillStyle = '#fff';
        ctx.fillText(label, lx + 7, ly + 11.5);
      } else if (d.type === 'fib') {
        var lo = Math.min(c.x1, c.x2), hi = Math.max(c.x1, c.x2);
        // Faint diagonal anchor line for context.
        ctx.lineWidth = 1; ctx.strokeStyle = sel ? 'rgba(230,200,79,0.5)' : 'rgba(91,141,239,0.4)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(c.x1, c.y1); ctx.lineTo(c.x2, c.y2); ctx.stroke();
        ctx.setLineDash([]);
        FIB_LEVELS.forEach(function (lvl) {
          var y = c.y2 + (c.y1 - c.y2) * lvl;
          var price = d.p2.price + (d.p1.price - d.p2.price) * lvl;
          ctx.lineWidth = lvl === 0.5 ? 1.5 : 1;
          ctx.strokeStyle = sel ? '#e6c84f' : '#c9a227';
          ctx.beginPath(); ctx.moveTo(lo, y); ctx.lineTo(hi, y); ctx.stroke();
          ctx.fillStyle = '#9aa4b2';
          ctx.fillText(lvl.toFixed(3).replace(/\.?0+$/, '') + '  ' + formatDrawPrice(price), lo + 3, y - 3);
        });
      }

      if (sel) [[c.x1, c.y1], [c.x2, c.y2]].forEach(function (hd) {
        ctx.beginPath(); ctx.arc(hd[0], hd[1], 5, 0, Math.PI * 2);
        ctx.fillStyle = '#e6c84f'; ctx.fill();
        ctx.strokeStyle = '#0b0e14'; ctx.lineWidth = 1; ctx.stroke();
      });
    });
  });
}

var curPrecision = 2;
function formatDrawPrice(p) { return isFinite(p) ? p.toFixed(curPrecision) : ''; }

function saveDrawings() {
  try {
    if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.chartDrawings && curSymbol) {
      webkit.messageHandlers.chartDrawings.postMessage({ symbol: curSymbol, json: JSON.stringify(drawings.filter(function (d0) { return d0.type !== 'ruler'; })) });
    }
  } catch (e) {}
}
function postDrawState() {
  try {
    if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.chartGeom) {
      webkit.messageHandlers.chartGeom.postMessage({ drawingActive: !!(drawTool || selectedIdx != null || draggingDraw) });
    }
  } catch (e) {}
}
function applyDrawings(str) {
  drawings = [];
  try {
    var arr = typeof str === 'string' ? JSON.parse(str) : str;
    if (Array.isArray(arr)) drawings = arr.filter(function (d) {
      return d && (d.type === 'hline' ? isFinite(d.price)
        : TWO_POINT[d.type] && d.p1 && d.p2 && isFinite(d.p1.t) && isFinite(d.p1.price) && isFinite(d.p2.t) && isFinite(d.p2.price));
    });
  } catch (e) {}
  selectedIdx = null; drawTool = null; draggingDraw = null;
  setChartInteraction(true);   // a symbol switch may land while a tool was armed
  if (candle) syncHlines();
  updateDrawbar(); postDrawState(); requestRedraw();
}

// Pause the main pane's own scroll/scale while a tool is armed or a drawing is being dragged
// (the placement/edit drag must not also pan the price scale).
function setChartInteraction(on) {
  if (!main) return;
  try {
    main.applyOptions({
      handleScroll: on ? { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: false, vertTouchDrag: true }
                       : { mouseWheel: false, pressedMouseMove: false, horzTouchDrag: false, vertTouchDrag: false },
      handleScale: on ? { mouseWheel: true, pinch: false, axisPressedMouseMove: { time: true, price: true }, axisDoubleClickReset: false }
                      : { mouseWheel: false, pinch: false, axisPressedMouseMove: { time: false, price: false }, axisDoubleClickReset: false },
    });
  } catch (e) {}
}

function updateDrawbar() {
  var bar = document.getElementById('drawbar'); if (!bar) return;
  ['trend', 'fib', 'rect', 'hline', 'ruler'].forEach(function (t) {
    bar.querySelector('.t-' + t).className = 't-' + t + (drawTool === t ? ' on' : '');
  });
  var sel = selectedIdx != null ? drawings[selectedIdx] : null;
  var ext = bar.querySelector('.t-ext');
  ext.className = 't-ext' + (sel && sel.type === 'trend' ? (sel.ext ? ' on' : '') : ' hidden');
  bar.querySelector('.t-del').className = 't-del' + (selectedIdx == null ? ' hidden' : '');
}

function installDrawTools(mainEl) {
  if (mainEl.dataset.drawTools === '1') return;   // #main persists across buildStructure — install once
  mainEl.dataset.drawTools = '1';
  var bar = document.getElementById('drawbar');
  if (!bar) {
    bar = document.createElement('div'); bar.id = 'drawbar';
    bar.innerHTML = '<div class="t-trend">╱</div><div class="t-fib">F</div><div class="t-rect">▭</div>'
                  + '<div class="t-hline">─</div><div class="t-ruler">⤢</div>'
                  + '<div class="t-ext hidden">→</div><div class="t-del hidden">🗑</div>';
    mainEl.appendChild(bar);
    bar.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); });
    ['trend', 'fib', 'rect', 'hline', 'ruler'].forEach(function (tool) {
      bar.querySelector('.t-' + tool).addEventListener('pointerup', function (e) {
        e.stopPropagation();
        drawTool = drawTool === tool ? null : tool;
        selectedIdx = null; syncHlines(); window.nativeGlideStop && nativeGlideStop();
        setChartInteraction(!drawTool); updateDrawbar(); postDrawState(); requestRedraw();
      });
    });
    bar.querySelector('.t-ext').addEventListener('pointerup', function (e) {
      e.stopPropagation();
      var d = selectedIdx != null ? drawings[selectedIdx] : null;
      if (d && d.type === 'trend') { d.ext = !d.ext; saveDrawings(); updateDrawbar(); requestRedraw(); }
    });
    bar.querySelector('.t-del').addEventListener('pointerup', function (e) {
      e.stopPropagation();
      if (selectedIdx != null) {
        drawings.splice(selectedIdx, 1);
        selectedIdx = null; syncHlines(); saveDrawings(); updateDrawbar(); postDrawState(); requestRedraw();
      }
    });
  }

  var downPt = null, moved = false;
  function pos(e) { var r = mainEl.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function inBody(pt) { try { return pt.x >= 0 && pt.x <= main.timeScale().width(); } catch (e) { return true; } }

  mainEl.addEventListener('pointerdown', function (e) {
    if (!main || !candle) return;
    var pt = pos(e); if (!inBody(pt)) return;
    downPt = pt; moved = false;
    window.nativeGlideStop && nativeGlideStop();
    if (drawTool && TWO_POINT[drawTool]) {
      var t = xToTime(pt.x), pr = yPrice(pt.y);
      if (t == null || pr == null) return;
      if (drawTool === 'ruler') drawings = drawings.filter(function (d0) { return d0.type !== 'ruler'; });
      drawings.push({ type: drawTool, p1: { t: t, price: pr }, p2: { t: t, price: pr } });
      draggingDraw = { idx: drawings.length - 1, part: 'p2' };
      try { mainEl.setPointerCapture(e.pointerId); } catch (x) {}
      e.preventDefault();
    } else if (drawTool === 'hline') {
      var pr2 = yPrice(pt.y);
      if (pr2 == null) return;
      drawings.push({ type: 'hline', price: pr2 });
      selectedIdx = drawings.length - 1; drawTool = null;
      setChartInteraction(true); syncHlines(); saveDrawings(); updateDrawbar(); postDrawState(); requestRedraw();
    } else if (selectedIdx != null) {
      var hit = hitTestDraw(pt);
      if (hit && hit.idx === selectedIdx) {
        var d = drawings[hit.idx];
        draggingDraw = {
          idx: hit.idx, part: hit.part,
          startLogical: main.timeScale().coordinateToLogical(pt.x), startPrice: yPrice(pt.y),
          orig: JSON.parse(JSON.stringify(d)),
        };
        setChartInteraction(false);
        try { mainEl.setPointerCapture(e.pointerId); } catch (x) {}
        e.preventDefault(); postDrawState();
      }
    }
  });

  mainEl.addEventListener('pointermove', function (e) {
    if (!draggingDraw || !main || !candle) return;
    var pt = pos(e); moved = true;
    var d = drawings[draggingDraw.idx]; if (!d) return;
    if (draggingDraw.part === 'p1' || draggingDraw.part === 'p2') {
      var t = xToTime(pt.x), pr = yPrice(pt.y);
      if (t != null && pr != null) d[draggingDraw.part] = { t: t, price: pr };
    } else if (draggingDraw.part === 'hline') {
      var pr3 = yPrice(pt.y);
      if (pr3 != null) { d.price = pr3; syncHlines(); }
    } else if (draggingDraw.part === 'line') {
      var curL = main.timeScale().coordinateToLogical(pt.x), curP = yPrice(pt.y);
      if (curL != null && curP != null && draggingDraw.startLogical != null && draggingDraw.startPrice != null) {
        var n = candleTimes.length;
        var iv = n > 1 ? candleTimes[n - 1] - candleTimes[n - 2] : 3600;
        var dT = (curL - draggingDraw.startLogical) * iv;
        var dP = curP - draggingDraw.startPrice;
        d.p1 = { t: draggingDraw.orig.p1.t + dT, price: draggingDraw.orig.p1.price + dP };
        d.p2 = { t: draggingDraw.orig.p2.t + dT, price: draggingDraw.orig.p2.price + dP };
      }
    }
    requestRedraw();
  });

  function endDrag(e) {
    var pt = pos(e);
    if (draggingDraw) {
      var d = drawings[draggingDraw.idx];
      // A two-point "draw" that never moved is a stray tap — discard it.
      if (d && TWO_POINT[d.type] && d.p1.t === d.p2.t && d.p1.price === d.p2.price) {
        drawings.splice(draggingDraw.idx, 1);
      } else if (drawTool && TWO_POINT[drawTool]) {
        selectedIdx = draggingDraw.idx; drawTool = null; updateDrawbar();
      }
      draggingDraw = null;
      setChartInteraction(true); syncHlines(); saveDrawings(); postDrawState(); requestRedraw();
      try { mainEl.releasePointerCapture(e.pointerId); } catch (x) {}
      return;
    }
    // Plain tap (native pan cancels DOM touches on real drags, so surviving pointerups are taps):
    // select / deselect.
    if (downPt && Math.hypot(pt.x - downPt.x, pt.y - downPt.y) < 8 && !drawTool) {
      var hit = hitTestDraw(pt);
      var next = hit ? hit.idx : null;
      if (next !== selectedIdx) {
        selectedIdx = next;
        syncHlines(); updateDrawbar(); postDrawState(); requestRedraw();
      }
    }
    downPt = null;
  }
  mainEl.addEventListener('pointerup', endDrag);
  mainEl.addEventListener('pointercancel', function (e) {
    if (draggingDraw) { draggingDraw = null; setChartInteraction(true); syncHlines(); saveDrawings(); postDrawState(); requestRedraw(); }
    downPt = null;
  });
}

// Push the layout geometry to Swift so native recognizers YIELD over the price axis, time
// axis, and dividers (those gestures stay DOM). Called after structure/data/divider changes.
function reportGeom() {
  try {
    if (!window.webkit || !webkit.messageHandlers || !webkit.messageHandlers.chartGeom || !main) return;
    var rect = function (el) { var r = el.getBoundingClientRect(); return { top: r.top, height: r.height }; };
    var charts = [main].concat(subs.map(function (s) { return s.chart; }));
    webkit.messageHandlers.chartGeom.postMessage({
      priceAxisW: main.priceScale('right').width() || 0,
      timeAxisH: (charts[charts.length - 1].timeScale().height()) || 0,
      panes: Array.prototype.map.call(document.querySelectorAll('#container .pane'), rect),
      dividers: Array.prototype.map.call(document.querySelectorAll('#container .divider'), rect),
    });
  } catch (e) { /* native gating falls back to permissive defaults */ }
}
window.addEventListener('resize', function () { requestAnimationFrame(reportGeom); });

// Re-enable autoscale on every pane, restore the default bar spacing, snap to the newest bar.
function resetView() {
  if (!main) return;
  [main].concat(subs.map(function (s) { return s.chart; })).forEach(function (c) {
    try { c.priceScale('right').applyOptions({ autoScale: true }); } catch (e) {}
  });
  try { main.timeScale().applyOptions({ barSpacing: 7, rightOffset: 8 }); } catch (e) {}
  main.timeScale().scrollToRealTime();
}

// Insert a drag handle between each pair of panes. Dragging shifts flex-grow from one pane to its
// neighbor (charts have autoSize → they resize automatically). TradingView-style: grow RSI and the
// candles shrink. flex-grow is relative, so the split survives rotation / screen-size changes.
function installDividers(paneEls) {
  var container = document.getElementById('container');
  Array.prototype.slice.call(container.querySelectorAll('.divider')).forEach(function (d) { container.removeChild(d); });
  paneEls.forEach(function (el, i) { el.style.flexGrow = (i === 0 ? '3' : '1'); el.style.flexBasis = '0'; });
  for (var i = 1; i < paneEls.length; i++) {
    var div = document.createElement('div'); div.className = 'divider';
    container.insertBefore(div, paneEls[i]);
    attachDividerDrag(div, paneEls[i - 1], paneEls[i], container);
  }
}

function attachDividerDrag(divider, above, below, container) {
  var dragging = false, lastY = 0;
  var MIN = 0.25; // a pane can't shrink below this share
  divider.addEventListener('pointerdown', function (e) {
    dragging = true; lastY = e.clientY;
    try { divider.setPointerCapture(e.pointerId); } catch (x) {}
    e.preventDefault();
  });
  divider.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var h = container.clientHeight || 1;
    var dy = e.clientY - lastY; lastY = e.clientY;
    var total = 0;
    Array.prototype.forEach.call(container.querySelectorAll('.pane'), function (p) { total += parseFloat(p.style.flexGrow || '1'); });
    var dGrow = (dy / h) * total;
    var a = parseFloat(above.style.flexGrow || '1') + dGrow;
    var b = parseFloat(below.style.flexGrow || '1') - dGrow;
    if (a < MIN || b < MIN) return;
    above.style.flexGrow = a; below.style.flexGrow = b;
  });
  function end(e) { if (dragging) { dragging = false; try { divider.releasePointerCapture(e.pointerId); } catch (x) {} requestAnimationFrame(reportGeom); } }
  divider.addEventListener('pointerup', end);
  divider.addEventListener('pointercancel', end);
}

// Update data on the existing series (no teardown → no flash; preserves the user's zoom).
function update(p, fit) {
  var data = (p.candles || []).map(function (c) { return { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close }; })
                              .sort(function (a, b) { return a.time - b.time; });
  candle.setData(data);
  if (!data.length) return;
  candle.applyOptions({ priceFormat: { type: 'price', precision: p.precision || 2, minMove: Math.pow(10, -(p.precision || 2)) } });
  curPrecision = p.precision || 2;
  // Log/linear price scale (main pane only; sub-panels are oscillators).
  try { main.priceScale('right').applyOptions({ mode: p.logScale ? 1 : 0 }); } catch (e) {}
  // Crosshair readout maps.
  candleArr = data; candleMap = {}; volMap = {};
  data.forEach(function (c) { candleMap[c.time] = c; });
  (p.volume || []).forEach(function (v) { volMap[v.time] = v.value; });

  var lines = p.lines || [];
  emaSeries.forEach(function (s, i) { s.setData(lines[i] ? clean(lines[i].points) : []); });
  vol.setData(p.volume || []);

  // EMA legend (top-left of the price pane) — only entries that actually have data.
  var legend = document.getElementById('legend');
  if (!legend) {
    legend = document.createElement('div'); legend.id = 'legend';
    document.getElementById('main').appendChild(legend);
  }
  legend.innerHTML = '';
  lines.forEach(function (ln) {
    if (!ln || !clean(ln.points).length) return;
    var s = document.createElement('span');
    s.style.color = ln.color; s.textContent = ln.label || '';
    legend.appendChild(s);
  });

  // Price lines are overlays on the persistent candle series — remove + re-add (no full-chart flash).
  priceLines.forEach(function (pl) { try { candle.removePriceLine(pl); } catch (e) {} });
  priceLines = [];
  (p.priceLines || []).forEach(function (l) {
    priceLines.push(candle.createPriceLine({ price: l.price, color: l.color, lineWidth: 1, lineStyle: l.dashed ? 2 : 0, axisLabelVisible: true, title: l.title }));
  });

  var allTimes = data.map(function (c) { return c.time; });
  candleTimes = allTimes;   // drawing anchors convert time ↔ x through this
  (p.subpanels || []).forEach(function (spec, idx) {
    var e = subs[idx]; if (!e) return;
    if (e.hist && spec.histogram) e.hist.setData(padToTimes(spec.histogram, allTimes));
    e.valueMaps = [];
    (spec.lines || []).forEach(function (ln, i) {
      var pts = clean(ln.points);
      if (e.lines[i]) e.lines[i].setData(padToTimes(pts, allTimes));
      var m = {};
      pts.forEach(function (q) { m[q.time] = q.value; });
      e.valueMaps.push({ color: ln.color, map: m, last: pts.length ? pts[pts.length - 1].value : null });
    });
  });
  renderReadouts(null);

  // Reset the view when the DATA IDENTITY (symbol|timeframe) changes: the user's manual price
  // range / pan from the previous instrument would leave the new one off-screen entirely (e.g.
  // BTC ~60k manual range → ETH ~3k renders below the viewport). Re-enable autoscale on every
  // pane and snap to the newest bar. Also runs on a fresh structure build (fit=true), using
  // scrollToRealTime rather than fitContent to keep the fixed barSpacing.
  var key = (p.symbol || '') + '|' + (p.tf || '');
  var identityChanged = key !== dataKey; dataKey = key;
  // Drawings are per-SYMBOL (time+price anchors render on any timeframe); reload only when
  // the symbol itself changes so in-memory edits aren't clobbered by a same-symbol repush.
  var sym = p.symbol || '';
  if (sym !== curSymbol) { curSymbol = sym; applyDrawings(p.drawings || '[]'); }
  if (fit || identityChanged) {
    [main].concat(subs.map(function (s) { return s.chart; })).forEach(function (c) {
      try { c.priceScale('right').applyOptions({ autoScale: true }); } catch (e) {}
    });
    main.timeScale().scrollToRealTime();
  }
  requestAnimationFrame(reportGeom);   // price-axis width changes with label magnitude
}

function render(p) {
  document.body.style.background = p.dark ? '#0b0e14' : '#ffffff';
  var k = structKeyOf(p);
  if (k !== structKey) { buildStructure(p); structKey = k; update(p, true); }
  else { update(p, false); }
}

window.setChart = function (payload) {
  try {
    var p = (typeof payload === 'string') ? JSON.parse(payload) : payload;
    if (window.LightweightCharts && document.getElementById('main')) render(p);
    else pending = p;
  } catch (e) { /* best-effort */ }
};
window.addEventListener('load', function () { if (pending) { render(pending); pending = null; } });
</script>
</body>
