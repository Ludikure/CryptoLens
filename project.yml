name: MarketScope
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    SWIFT_EMIT_LOC_STRINGS_RESOURCES: YES
    DEVELOPMENT_TEAM: 6AS729C9FR
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "23"
options:
  bundleIdPrefix: com.ludikure
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  MarketScope:
    type: application
    platform: iOS
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    sources:
      - CryptoLens
    info:
      path: CryptoLens/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: MarketScope
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: SystemBackground
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: false
        # API keys removed from bundle — all calls go through worker proxy
        BGTaskSchedulerPermittedIdentifiers:
          - com.ludikure.CryptoLens.priceCheck
        UIBackgroundModes:
          - fetch
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludikure.CryptoLens
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6AS729C9FR
    entitlements:
      path: MarketScope.entitlements
      properties:
        aps-environment: development
        # The widget target has always declared this group and reads `widget_data` from it, but the
        # main app never declared it — so the app wrote to standard UserDefaults, the widget read an
        # empty group container, and the widget was permanently blank. The group is already
        # registered in the Developer portal and present in BOTH the dev and store provisioning
        # profiles for com.ludikure.CryptoLens (verified), so declaring it here is a no-op for
        # signing. See Utils/WidgetDataWriter.swift for the writer.
        com.apple.security.application-groups:
          - group.com.ludikure.CryptoLens
    dependencies:
      - target: MarketScopeWidget
    scheme:
      testTargets:
        - MarketScopeTests
        - MarketScopeUITests
      run:
        environmentVariables:
          - variable: IDEPreferLogStreaming
            value: "YES"
            isEnabled: true

  # Unit tests: pure logic (the pinch axis decomposition) that XCUIElement.pinch can't exercise
  # — it only spreads vertically, so the horizontal-zoom path has no UI-test coverage.
  MarketScopeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MarketScopeTests
    dependencies:
      - target: MarketScope
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludikure.CryptoLens.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  # UI test target: drives REAL touches (pan / pinch / axis drags) against the chart on the
  # simulator — the only way to verify the native gesture recognizer end-to-end without a
  # physical device. Run: xcodebuild test -scheme MarketScope -only-testing MarketScopeUITests
  MarketScopeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MarketScopeUITests
    dependencies:
      - target: MarketScope
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludikure.CryptoLens.uitests
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: MarketScope
        GENERATE_INFOPLIST_FILE: YES

  MarketScopeWidget:
    type: app-extension
    platform: iOS
    sources:
      - MarketScopeWidget
    info:
      path: MarketScopeWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: MarketScope Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludikure.CryptoLens.widget
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: MarketScopeWidget/MarketScopeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ludikure.CryptoLens
